<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lasso</title>
<style>
  :root {
    --bg: #f6f5f2; --surface: #ffffff; --surface2: #ecebe6; --ink: #1d1c1a; --muted: #6b675f; --line: #dcd8cf;
    --accent: #b3471d; --pill: #e9e5dc;
    --good: #2f7a3d; --crit: #b3471d; --amber: #b8700c; --run: #2b62b8;
    --crit-bg: #fbe9e7; --amber-bg: #fdf1dc; --good-bg: #e5f3ea; --run-bg: #e6eefb;
    --term-bg: #1c1d22; --term-ink: #d7d5cd; --term-dim: #8f8c84; --term-bright: #f2f0ea; --term-line: #33353d; --term-pill: #2e3038; --term-ok: #8fd19a;
    --pulse: 1.4s; /* one pulse cycle; the Tick dot reads it to hold a fast Tick's pulse */
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17171a; --surface: #1e1e23; --surface2: #27272d; --ink: #ecebe6; --muted: #a09c93; --line: #2d2d33;
      --accent: #e5714a; --pill: #26262c;
      --good: #6fbf7a; --crit: #e5714a; --amber: #e0a24a; --run: #7aa6e8;
      --crit-bg: #3a2320; --amber-bg: #3a2e17; --good-bg: #1d3326; --run-bg: #1d2a40;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17171a; --surface: #1e1e23; --surface2: #27272d; --ink: #ecebe6; --muted: #a09c93; --line: #2d2d33;
    --accent: #e5714a; --pill: #26262c;
    --good: #6fbf7a; --crit: #e5714a; --amber: #e0a24a; --run: #7aa6e8;
    --crit-bg: #3a2320; --amber-bg: #3a2e17; --good-bg: #1d3326; --run-bg: #1d2a40;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 ui-sans-serif, system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0 16px 0 0; letter-spacing: 0.04em; }
  form[data-role="intake"] { display: flex; gap: 8px; flex: 1 1 320px; }
  form[data-role="intake"] input { flex: 1; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; }
  button { font: inherit; padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--pill); color: inherit; cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.sm { padding: 3px 9px; font-size: 12px; }
  button:disabled { opacity: 0.6; cursor: default; }
  button.busy { opacity: 1; cursor: progress; }
  button.busy::after { content: ''; display: inline-block; width: 0.75em; height: 0.75em; margin-left: 6px; vertical-align: -1px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tick { display: flex; gap: 8px; align-items: center; color: var(--muted); font-variant-numeric: tabular-nums; }
  main { padding: 16px; }
  .empty { color: var(--muted); padding: 32px 0; text-align: center; }
  .notice { color: var(--crit); }
  .muted { color: var(--muted); }
  .eyebrow { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.35; } 100% { opacity: 1; } }
  /* The header's Tick dot: still when idle, pulsing while a Tick runs, red and still while Lasso is unreachable. */
  .tick-dot.down { background: var(--crit); animation: none; }
  @media (prefers-reduced-motion: reduce) { .pulse, .dot.running { animation: none !important; } }

  /* status */
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--pill); white-space: nowrap; align-self: start; }
  .pill.flagged { background: var(--crit-bg); color: var(--crit); }
  .pill.needs_you, .pill.holding, .pill.ready { background: var(--amber-bg); color: var(--amber); }
  .pill.running, .pill.queued { background: var(--run-bg); color: var(--run); }
  .pill.quiet, .pill.done { background: var(--good-bg); color: var(--good); }
  .pill.abandoned { background: var(--surface2); color: var(--muted); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.flagged { background: var(--crit); }
  .dot.needs_you, .dot.holding, .dot.ready { background: var(--amber); }
  .dot.running, .dot.queued { background: var(--run); }
  .dot.running { animation: pulse var(--pulse) infinite; }
  .dot.quiet, .dot.done { background: var(--good); }

  /* layout: the Ledger, collapsing to a sidebar when a detail is open */
  .dwrap { display: grid; grid-template-columns: 1fr; gap: 16px; align-items: start; }
  .dwrap.open { grid-template-columns: 280px minmax(0, 1fr); }
  @media (max-width: 800px) { .dwrap.open { grid-template-columns: 1fr; } .dwrap.open .dside { max-height: 220px; overflow: auto; } }
  .dside { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .dside .back { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 12px; }
  .dside a.back-link { color: var(--muted); text-decoration: none; }
  .qitem { padding: 8px 12px; border-top: 1px solid var(--line); cursor: pointer; display: flex; gap: 10px; align-items: flex-start; }
  .back + .qitem { border-top: 0; }
  .qitem:hover { background: var(--surface2); }
  .qitem.sel { background: var(--surface2); box-shadow: inset 3px 0 var(--accent); }
  .qitem .dot { margin-top: 6px; }
  .qitem .ref { font-size: 11px; color: var(--muted); }
  .qitem .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .qitem.ended { opacity: 0.55; }

  /* the Ledger */
  .ledger-tools { display: flex; justify-content: flex-end; margin: 0 0 8px; font-size: 13px; color: var(--muted); }
  .ledger-tools label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  [data-role="ledger"] { display: grid; gap: 8px; }
  .ticket { display: grid; grid-template-columns: max-content 120px minmax(160px, 1fr) 150px max-content 64px max-content; gap: 4px 14px; align-items: center; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  .ticket:hover { border-color: var(--accent); }
  .ticket.ended { opacity: 0.55; }
  .ticket .ref { font-variant-numeric: tabular-nums; font-weight: 600; }
  .ticket .why, .ticket .repo, .ticket .last { color: var(--muted); font-size: 12px; }
  .ticket .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ticket .why { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ticket .track { display: grid; gap: 2px; }
  .ticket .track svg { display: block; width: 100%; max-width: 132px; height: 18px; }
  .ticket .track .stage { color: var(--muted); font-size: 11px; }
  .ticket .last { font-variant-numeric: tabular-nums; text-align: right; }
  .ticket .quick { min-width: 0; }
  @media (max-width: 900px) {
    .ticket { grid-template-columns: max-content 1fr max-content; }
    .ticket .track, .ticket .rings, .ticket .last, .ticket .quick { grid-column: span 1; }
    .ticket .title-cell { grid-column: 1 / -1; }
  }
  .rings { display: flex; gap: 4px; align-self: center; }
  .rings svg { width: 18px; height: 18px; }
  .rings .track, .gauge .track { fill: none; stroke: var(--surface2); stroke-width: 3; }
  .rings .arc { fill: none; stroke: var(--good); stroke-width: 3; transform: rotate(-90deg); transform-origin: 50% 50%; }
  .rings .warn .arc { stroke: var(--amber); }
  .rings .over .arc { stroke: var(--crit); }

  /* the detail */
  .detail { display: grid; gap: 12px; min-width: 0; }
  .titlebar { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
  .titlebar h2 { font-size: 18px; margin: 2px 0; text-wrap: balance; }
  .titlebar .eyebrow a { color: var(--accent); }
  .titlebar .right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .triggers { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .override { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--crit); }
  .override button { border-color: var(--crit); background: transparent; color: var(--crit); }
  .flow { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px 6px; overflow-x: auto; }
  .flow svg { display: block; max-width: 100%; height: auto; }
  @media (max-width: 720px) { .flow svg { max-width: none; } }
  .flow .node { cursor: pointer; }
  .flow text { fill: var(--ink); font-size: 12px; font-family: inherit; }
  .flow text.name { font-weight: 500; }
  .flow text.name.cur { font-weight: 600; }
  .flow text.name.dim { fill: var(--muted); }
  .flow text.sub { fill: var(--muted); font-size: 10.5px; }
  .flow text.act { fill: var(--muted); font-size: 10px; }
  .flow text.bang { fill: var(--surface); font-weight: 700; font-size: 13px; }
  .flow text.badge-text { fill: var(--surface); font-size: 11px; font-weight: 600; }
  .flow text.count { font-size: 10px; font-weight: 700; }
  .flow .pulse { animation: pulse var(--pulse) infinite; }
  .flow .legend { font-size: 11px; color: var(--muted); padding: 6px 0 0; border-top: 1px solid var(--line); margin-top: 6px; }
  .flagbox { display: grid; gap: 8px; padding: 12px 16px; border: 1px solid var(--crit); background: var(--crit-bg); border-radius: 8px; }
  .flagbox .reason { font-weight: 600; color: var(--crit); }
  .flagbox .last { white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--muted); max-height: 6em; overflow: auto; }
  .dgrid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(260px, 1fr); gap: 12px; align-items: start; }
  @media (max-width: 900px) { .dgrid { grid-template-columns: 1fr; } }
  .stack { display: grid; gap: 12px; min-width: 0; }
  .panel { display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
  .panel h3 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .panel .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .gauges { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .gauge { display: grid; justify-items: center; gap: 2px; cursor: pointer; font-size: 11px; color: var(--muted); text-align: center; }
  .gauge svg { width: 56px; height: 56px; }
  .gauge .arc { fill: none; stroke: var(--good); stroke-width: 6; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
  .gauge.warn .arc { stroke: var(--amber); }
  .gauge.over .arc { stroke: var(--crit); }
  .gauge .value { color: var(--ink); font-variant-numeric: tabular-nums; }
  .editor { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; align-items: end; }
  .editor label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  .editor input { padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; font: inherit; width: 100%; }
  .editor .row { display: flex; flex-wrap: wrap; gap: 8px; grid-column: 1 / -1; align-items: center; }
  .confirm { display: grid; gap: 8px; padding: 12px 16px; border: 1px solid var(--line); border-radius: 8px; margin: 0 0 16px; max-width: 720px; }
  .confirm .row { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  .confirm label, .why { color: var(--muted); }
  .confirm select { padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; }
  .kind { text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px; color: var(--muted); }
  .detail dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 0; font-size: 12px; }
  .detail dt { color: var(--muted); }
  .detail dd { margin: 0; font-family: ui-monospace, monospace; word-break: break-all; }

  /* the Session pane: a dark terminal */
  .session { display: grid; gap: 8px; padding: 12px; border-radius: 8px; background: var(--term-bg); color: var(--term-ink); font-family: ui-monospace, monospace; font-size: 12px; min-width: 0; }
  .session .head { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  .session .head strong { color: var(--term-bright); }
  .session .meta { color: var(--term-dim); }
  .session .feedback { display: grid; gap: 4px; margin: 8px 0; font-size: 13px; }
  .session .feedback h4 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--term-dim); }
  .session .feedback .row { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
  .session .feedback .kind { color: var(--term-dim); font-variant-numeric: tabular-nums; }
  .session .pill { background: var(--term-pill); color: var(--term-bright); }
  .session .pill.succeeded { background: var(--good); color: #fff; }
  .session .pill.running { background: var(--run); color: #fff; }
  .session .pill.failed, .session .pill.exhausted, .session .pill.interrupted { background: var(--crit); color: #fff; }
  .session pre { margin: 0; max-height: 360px; overflow: auto; white-space: pre-wrap; word-break: break-all; color: var(--term-dim); }
  .session pre[data-trimmed]::before { content: '… earlier output trimmed; the whole log is at the stdout path below'; display: block; color: var(--muted); }
  .session .final { color: var(--term-bright); border-top: 1px solid var(--term-line); padding-top: 8px; white-space: pre-wrap; }
  .session .final.ok { color: var(--term-ok); }
  .session .paths { display: flex; flex-wrap: wrap; gap: 6px; }
  .session .paths button { font: inherit; font-size: 11px; padding: 2px 8px; background: var(--term-pill); color: var(--term-dim); border-color: var(--term-line); }
  .session button.stop { background: var(--crit); color: #fff; border-color: var(--crit); font: inherit; }
  .session .hint { color: var(--term-dim); }

  /* the Sessions timeline */
  .timeline { list-style: none; margin: 4px 0 0 6px; padding: 0 0 0 16px; border-left: 2px solid var(--line); display: grid; gap: 6px; font-size: 12px; }
  .timeline li { position: relative; padding: 2px 6px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .timeline li::before { content: ""; position: absolute; left: -23px; top: 7px; width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--muted)); box-shadow: 0 0 0 2px var(--surface); }
  .timeline .when { color: var(--muted); font-variant-numeric: tabular-nums; }
  .timeline .pill { font-size: 11px; padding: 1px 6px; }
  .timeline .pill.succeeded { background: var(--good-bg); color: var(--good); }
  .timeline .pill.failed, .timeline .pill.exhausted { background: var(--crit-bg); color: var(--crit); }
  .timeline .pill.interrupted { background: var(--amber-bg); color: var(--amber); }

  /* Pipelines and Config: shared form parts */
  nav.views { display: flex; gap: 4px; }
  nav.views a { color: var(--muted); text-decoration: none; padding: 4px 10px; border-radius: 6px; }
  nav.views a:hover { color: var(--ink); background: var(--surface2); }
  nav.views a.on { color: var(--ink); background: var(--surface2); font-weight: 600; }
  .panel h2 { margin: 0; font-size: 16px; }
  .card { display: grid; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; }
  .card.problem { border-color: var(--crit); }
  .card .links { display: flex; flex-wrap: wrap; gap: 12px; }
  .card pre { margin: 0; white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .card h3 { margin: 0; font-size: 13px; display: flex; gap: 8px; align-items: baseline; text-transform: none; letter-spacing: 0; color: var(--ink); }
  .plist a .why, .card .why, .panel .why { color: var(--muted); font-size: 12px; }
  dd .drift, .bar .drift { color: var(--amber); }
  [data-role="pipeline-version"] a, [data-role="live-versions"] a { color: var(--accent); }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px 14px; align-items: end; }
  .fields label, .fields .check { display: grid; gap: 5px; font-size: 12.5px; color: var(--muted); }
  .fields label.wide { grid-column: 1 / -1; }
  .fields .check { display: flex; align-items: flex-start; gap: 8px; color: var(--ink); font-size: 13px; line-height: 1.35; }
  .fields .check input { margin: 2px 0 0; accent-color: var(--accent); }
  .fields input, .fields select, .fields textarea { padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: inherit; font: inherit; min-width: 0; }
  .fields input:focus, .fields select:focus, .fields textarea:focus, textarea.raw:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .fields textarea { min-height: 96px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.5; resize: vertical; }
  .fields .ro { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  .fields .ro span { color: var(--ink); }
  .fields .ro.wide { grid-column: 1 / -1; }
  textarea.raw { width: 100%; min-height: 480px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: inherit; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; line-height: 1.55; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .bar .path { font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); word-break: break-all; }
  .panel.editor-panel { background: transparent; border: 0; padding: 0; }
  :is(.ed, .pf-drawer) :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.danger { background: transparent; color: var(--crit); border-color: transparent; }
  button.danger:hover { border-color: var(--crit); }
  button.quiet { background: transparent; }

  /* Page heads: the thing's name, then where it lives on disk */
  .ed { display: grid; gap: 20px; min-width: 0; max-width: 1080px; }
  .ed-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: flex-end; justify-content: space-between; }
  .ed-head h2 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -0.01em; }
  .ed-head .path { display: block; margin-top: 2px; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); overflow-wrap: anywhere; }
  .ed-head .bar { flex: none; }
  .ed .group-title { margin: 8px 0 -8px; font-size: 15px; font-weight: 600; text-transform: none; letter-spacing: 0; color: var(--ink); }
  .group-title span { font-weight: normal; color: var(--muted); font-size: 13px; margin-left: 8px; }

  /* The save bar sticks to the bottom of what it saves, and says when there is something to save */
  .savebar { position: sticky; bottom: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--line); border-radius: 0 0 10px 10px; }
  .savebar .state { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .savebar .state::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  .dirty .savebar .state { color: var(--amber); }
  .dirty .savebar .state::before { background: var(--amber); }
  .savebar .why { flex: 1 1 240px; text-align: right; }

  /* Config: one sheet per kind of setting. Saved-with-Save is a solid sheet with its own save bar;
     saves-at-once is a sheet of tiles; read-only from config.yaml is recessed and dashed. */
  .sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  .sheet.readonly { background: transparent; border-style: dashed; }
  .setting { display: grid; grid-template-columns: minmax(180px, 260px) minmax(0, 1fr); gap: 12px 32px; padding: 18px 20px; border-top: 1px solid var(--line); }
  .setting:first-child { border-top: 0; }
  @media (max-width: 760px) { .setting { grid-template-columns: 1fr; padding: 16px; } }
  .setting h3 { margin: 0 0 4px; font-size: 14px; font-weight: 600; text-transform: none; letter-spacing: 0; color: var(--ink); }
  .setting .about { margin: 0; font-size: 12.5px; color: var(--muted); max-width: 32ch; }
  .setting .cfg-body { min-width: 0; display: grid; gap: 10px; align-content: start; }
  .setting .fields { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
  .setting .fields.checks { grid-template-columns: 1fr; gap: 10px; }
  .setting .fields.checks .check:first-child { padding-bottom: 10px; border-bottom: 1px solid var(--line); font-weight: 600; }
  .readonly .note { font-size: 12.5px; color: var(--muted); }
  .readonly .note code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink); }
  .repos { width: 100%; border-collapse: collapse; font-size: 13px; }
  .repos th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 0 12px 6px 0; border-bottom: 1px solid var(--line); }
  .repos td { padding: 8px 12px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .repos tr:last-child td { border-bottom: 0; }
  .repos td.path { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); overflow-wrap: anywhere; }
  @media (max-width: 640px) { .repos thead { display: none; } .repos tr { display: grid; padding: 8px 0; border-bottom: 1px solid var(--line); } .repos td { border: 0; padding: 1px 0; } }
  .action-def { display: grid; gap: 6px; }

  /* Agent Profiles on Config: one tile each, opening the drawer */
  .pf-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .pf-list a { display: grid; gap: 6px; align-content: start; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); cursor: pointer; color: inherit; text-decoration: none; }

  /* Pipelines: the list, with each Pipeline's Stages drawn as a little line */
  .pipelines-grid { display: grid; grid-template-columns: minmax(200px, 250px) minmax(0, 1fr); gap: 24px; align-items: start; }
  @media (max-width: 760px) { .pipelines-grid { grid-template-columns: 1fr; } }
  .plist-wrap { position: sticky; top: 12px; display: grid; gap: 10px; }
  @media (max-width: 760px) { .plist-wrap { position: static; } }
  .plist { display: grid; gap: 2px; }
  .plist a { display: grid; gap: 4px; padding: 8px 10px; border-radius: 8px; color: inherit; text-decoration: none; }
  .plist a:hover { background: var(--surface2); }
  .plist a.current { background: var(--surface); box-shadow: inset 3px 0 var(--accent), 0 0 0 1px var(--line); }
  .plist a strong { font-weight: 600; }
  .plist svg { display: block; height: 12px; max-width: 100%; }
  .plist .count { font-size: 12px; color: var(--muted); }
  [data-role="new-pipeline"] { padding: 12px; border: 1px dashed var(--line); border-radius: 8px; }
  [data-role="new-pipeline"] .fields { grid-template-columns: 1fr; }
  .info-strip { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; padding: 10px 14px; border-radius: 8px; background: var(--run-bg); color: var(--ink); font-size: 13px; }
  .info-strip h3 { margin: 0; font-size: 13px; font-weight: 600; text-transform: none; letter-spacing: 0; color: var(--run); }
  .info-strip .why { flex-basis: 100%; }

  /* Pipeline settings, then the Stages on a line, one station each */
  .pipe-form { display: grid; gap: 0; background: transparent; border: 0; padding: 0; }
  .pipe-settings { padding: 16px 20px; margin-bottom: 24px; }
  .pipe-settings h3 { margin: 0 0 2px; font-size: 14px; font-weight: 600; text-transform: none; letter-spacing: 0; color: var(--ink); }
  .pipe-settings .about { margin: 0 0 12px; font-size: 12.5px; color: var(--muted); }
  .stages-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0 0 10px; }
  .stages-head h3 { margin: 0; font-size: 15px; font-weight: 600; text-transform: none; letter-spacing: 0; color: var(--ink); }
  .stages-head .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); align-items: center; }
  .stages-head .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .stages-head .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 2.5px solid var(--k); }
  .stages-head .legend i.bar { width: 10px; height: 10px; border: 0; border-radius: 3px; background: var(--k); }
  .rail { position: relative; display: grid; gap: 0; padding-bottom: 8px; }
  .rail::before { content: ''; position: absolute; left: 17px; top: 18px; bottom: 26px; width: 4px; border-radius: 2px; background: var(--surface2); }
  .stage { --k: var(--run); position: relative; display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 12px; padding: 0; border: 0; }
  .stage.k-human { --k: var(--amber); }
