  .station { position: relative; z-index: 1; justify-self: center; margin-top: 9px; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; border: 3.5px solid var(--k); background: var(--bg); font-size: 12px; font-weight: 700; color: var(--k); font-variant-numeric: tabular-nums; }
  .k-action .station { width: 24px; height: 24px; margin-top: 12px; border: 0; border-radius: 6px; background: var(--k); color: var(--bg); }
  .stage-box { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--k); border-radius: 8px; }
  .k-action .stage-box { background: transparent; border-color: var(--line); border-left-color: var(--k); }
  .stage-box h3 { display: flex; align-items: center; gap: 10px; margin: 0; padding: 8px 10px 8px 12px; font-size: 14px; text-transform: none; letter-spacing: 0; color: var(--ink); }
  .stage-toggle { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: center; padding: 2px 0; border: 0; background: none; text-align: left; font: inherit; color: inherit; cursor: pointer; }
  .stage-toggle .nm { font-weight: 600; font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
  .stage-toggle .kind { justify-self: start; font-size: 11.5px; padding: 1px 8px; border-radius: 999px; color: var(--k); background: color-mix(in srgb, var(--k) 14%, transparent); text-transform: none; letter-spacing: 0; font-weight: 500; }
  .k-action .stage-toggle .kind { color: var(--ink); background: var(--pill); }
  .stage-toggle .sum { flex: 1 1 160px; min-width: 0; font-size: 12.5px; font-weight: normal; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stage-toggle .peek { flex-basis: 100%; min-width: 0; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stage-box h3::after { content: ''; flex: none; width: 7px; height: 7px; margin: 0 4px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; order: 3; }
  .stage.open .stage-box h3::after { transform: rotate(45deg); }
  .stage.open .stage-toggle .peek { display: none; }
  .stage-box h3 .tools { order: 2; margin-left: 0; display: flex; gap: 2px; }
  .stage-box h3 .tools button { background: transparent; border-color: transparent; color: var(--muted); }
  .stage-box h3 .tools button:hover:not(:disabled) { border-color: var(--line); color: var(--ink); }
  .stage-box h3 .tools button:disabled { opacity: 0.3; }
  .stage-box h3 .removed-note { display: none; color: var(--crit); font-weight: normal; font-size: 12px; }
  .stage-fields { display: grid; gap: 0; border-top: 1px solid var(--line); }
  .k-action .stage-fields { padding: 14px 14px 16px; }
  .fgroup { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 8px 16px; padding: 14px; border-top: 1px solid var(--line); }
  .fgroup:first-child { border-top: 0; }
  .fgroup > h4 { margin: 6px 0 0; font-size: 12.5px; font-weight: 600; color: var(--ink); }
  @media (max-width: 640px) { .fgroup { grid-template-columns: 1fr; } }
  .stage.removed .stage-box { border-style: dashed; border-left-style: solid; opacity: 0.6; }
  .stage.removed .station { opacity: 0.4; }
  .stage.removed .stage-fields, .stage.removed .stage-toggle .peek { display: none; }
  .stage.removed .stage-box h3 .removed-note { display: inline; }
  .stage.fresh .stage-box { border-color: var(--accent); border-left-color: var(--k); }
  .add-stage { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 32px; padding: 4px 0 4px 6px; }
  .add-stage button[data-role="add-stage"] { width: 26px; height: 26px; padding: 0; border-radius: 50%; border: 2px dashed var(--line); background: var(--bg); color: var(--muted); font-size: 15px; line-height: 1; }
  .add-stage button[data-role="add-stage"]:hover, .add-stage button[data-role="add-stage"]:focus-visible { border-color: var(--accent); color: var(--accent); border-style: solid; }
  .add-stage button { font-size: 12px; }
  .add-stage .add-k { margin-left: 44px; }
  .add-stage .add-k + .add-k { margin-left: 0; }
  .pipe-form > .savebar { border: 1px solid var(--line); border-radius: 10px; margin-top: 4px; }
  .pf-pickbtn { display: grid; gap: 2px; justify-items: start; text-align: left; width: 100%; padding: 8px 10px; background: var(--bg); }
  .pf-pickbtn:hover { border-color: var(--accent); }

  /* Agent Profiles: the Config list, and the drawer that edits them */
  .pf-list .default, .pf-drawer .default { font-size: 11px; color: var(--accent); font-weight: normal; margin-left: 6px; }
  .pf-summary { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); overflow-wrap: anywhere; }
  .pf-warn { margin: 0; padding: 0 0 0 18px; color: var(--amber); font-size: 12px; }
  .pf-na { opacity: 0.45; }
  .pf-na span { padding: 4px 0; }
  .pf-modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  @media (max-width: 640px) { .pf-modes { grid-template-columns: 1fr; } }
  .pf-modes > div { border: 1px dashed var(--line); border-radius: 6px; padding: 8px; display: grid; gap: 6px; align-content: start; }
  .pf-modes .fields { grid-template-columns: 1fr; }
  .pf-drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100vw); z-index: 50; background: var(--bg); border-left: 1px solid var(--line); box-shadow: -8px 0 24px rgba(0,0,0,.15); display: grid; grid-template-columns: 200px minmax(0, 1fr); }
  @media (max-width: 640px) { .pf-drawer { grid-template-columns: 1fr; grid-template-rows: max-content minmax(0, 1fr); } .pf-drawer nav { border-right: 0; border-bottom: 1px solid var(--line); max-height: 30vh; overflow: auto; } }
  .pf-drawer nav { border-right: 1px solid var(--line); padding: 12px; display: grid; gap: 4px; align-content: start; overflow: auto; }
  .pf-drawer nav a { padding: 6px 8px; border-radius: 6px; cursor: pointer; display: grid; color: inherit; text-decoration: none; }
  .pf-drawer nav a:hover { background: var(--surface2); }
  .pf-drawer nav a.on { background: var(--surface2); box-shadow: inset 3px 0 var(--accent); }
  .pf-drawer nav button { justify-self: start; margin-top: 4px; }
  .pf-drawer section { padding: 16px; overflow: auto; display: grid; gap: 12px; align-content: start; }
  .pf-drawer h2 { margin: 0; font-size: 16px; }
  .pf-list .pf-scope, .pf-drawer .pf-scope { font-size: 11px; color: var(--muted); font-weight: normal; margin-left: 6px; }
  .pf-tabs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  .pf-tabs button[role="tab"] { border-radius: 6px 6px 0 0; }
  .pf-tabs button[role="tab"].on { background: var(--surface2); box-shadow: inset 0 -2px var(--accent); font-weight: 600; }
  .pf-tabs select { margin-left: auto; width: auto; }
  .pf-pickbtn .pf-pickname { font-weight: 600; }
  .pf-pickbtn .pf-summary { white-space: pre-wrap; }
  .pf-pickbtn .pf-overridden { font-size: 11px; color: var(--amber); font-weight: normal; margin-left: 6px; }
  .stage-profiles { display: grid; gap: 8px; }
  .stage-profiles .stage-name { font-size: 12px; color: var(--muted); }
  .triggers .why { flex-basis: 100%; }
</style>
</head>
<body>
<header>
  <h1>LASSO</h1>
  <form data-role="intake" autocomplete="off">
    <input name="input" placeholder="Paste a JIRA key, a GitHub issue, or type a prompt" aria-label="Intake">
    <button class="primary" type="submit">Add</button>
  </form>
  <div class="tick">
    <span class="dot tick-dot" data-role="tick-dot" role="img"></span>
    <button type="button" data-role="check-now">Check now</button>
  </div>
  <nav class="views"><a href="#">Tickets</a><a href="#pipelines">Pipelines</a><a href="#config">Config</a></nav>
</header>
<main>
  <p data-role="notice" class="notice" hidden></p>
  <form data-role="confirm" class="confirm" hidden></form>
  <div class="dwrap" data-role="layout">
    <aside class="dside" data-role="side" hidden></aside>
    <div class="dmain">
      <div class="ledger-tools" data-role="ledger-tools"><label><input type="checkbox" data-role="show-ended"> Show done and Abandoned</label></div>
      <section data-role="ledger" aria-label="Tickets"></section>
      <section data-role="detail" class="detail" hidden></section>
      <section data-role="pipelines" class="panel editor-panel" aria-label="Pipelines" hidden></section>
      <section data-role="config" class="panel editor-panel" aria-label="Config" hidden></section>
    </div>
  </div>
</main>
<script type="module">
import { metroDiagram, metroTrack, sessionsForStage, quickAction, duration, relative, tickIndicator, sessionProfile, stageProfileView, ticketProfileView, ledgerStageText } from './metro.js';
import { showConfig } from './app/config/mount.tsx';
import { showPipelines, adoptOldStagesForm } from './app/pipelines/mount.tsx';
import { openProfileDrawer } from './app/profiles/drawer.tsx';
import { events } from './app/events.ts';
(function () {
  const $ = (sel) => document.querySelector(sel);
  const layout = $('[data-role="layout"]');
  const side = $('[data-role="side"]');
  const ledger = $('[data-role="ledger"]');
  const detail = $('[data-role="detail"]');
  const confirmPanel = $('[data-role="confirm"]');
  const pipelinesPanel = $('[data-role="pipelines"]');
  const configPanel = $('[data-role="config"]');
  const tickDot = $('[data-role="tick-dot"]');
  const notice = $('[data-role="notice"]');
  const intakeForm = $('form[data-role="intake"]');
  const showEnded = $('[data-role="show-ended"]');
  const ledgerTools = $('[data-role="ledger-tools"]');

  async function api(route, init) {
    const res = await fetch(route, Object.assign({ headers: { 'content-type': 'application/json' } }, init || {}));
    const text = await res.text();
    const body = text ? JSON.parse(text) : null;
    if (!res.ok) { const err = new Error((body && body.error) || (res.status + ' ' + route)); err.status = res.status; err.body = body; throw err; }
    return body;
  }

  function el(tag, attrs, children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === 'class') node.className = v; else if (k === 'text') node.textContent = v; else node.setAttribute(k, v);
    }
    for (const child of children || []) node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
    return node;
  }

  function showNotice(msg) { notice.textContent = msg || ''; notice.hidden = !msg; }

  // 'connecting' until the first status or error (the dot keeps its bare markup), 'down' while Lasso is
  // unreachable, else the last Tick status the server sent; the one-second clock redraws the tooltip from it.
  let tickNow = 'connecting';
  // A running Tick pulses the dot for at least one full cycle of the pulse animation, so a fast one still shows.
  // The tooltip follows the status at once and does not wait for the hold.
  const PULSE_MS = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--pulse')) * 1000;
  let pulseUntil = 0;
  let pulseTimer = null;
  function drawTick() {
    if (tickNow === 'connecting') return;
    const now = Date.now();
    const { state, title } = tickIndicator(tickNow, now);
    const shown = state === 'idle' && now < pulseUntil ? 'running' : state;
    tickDot.className = 'dot tick-dot ' + shown;
    tickDot.title = title;
    tickDot.setAttribute('aria-label', title);
    clearTimeout(pulseTimer);
    if (shown !== state) pulseTimer = setTimeout(drawTick, pulseUntil - now);
  }
  function pulseTick() { pulseUntil = Math.max(pulseUntil, Date.now() + PULSE_MS); drawTick(); }
  function showTick(t) {
    // /api/events gathers changes briefly, so a fast Tick can arrive already ended; a newer lastTick than a
    // still status means one ran unseen. A Tick seen running has had its pulse.
    const prev = typeof tickNow === 'object' ? tickNow : null;
    tickNow = t;
    if (t.running || (prev && !prev.running && t.lastTick !== prev.lastTick)) pulseTick(); else drawTick();
  }
  function lostLasso() { tickNow = 'down'; drawTick(); }
  async function refreshTick() {
    try { showTick(await api('/api/tick')); }
    catch (e) { lostLasso(); }
  }

  function svg(tag, attrs) {
    const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
    return node;
  }

  // One ring: the arc is the share used, amber from 70 %, red at the limit.
  function ring(g, size) {
    const r = size / 2 - 4, c = 2 * Math.PI * r;
    const share = g.limit > 0 ? Math.min(1, g.used / g.limit) : 1;
    const node = svg('svg', { viewBox: '0 0 ' + size + ' ' + size, class: share >= 1 ? 'over' : share >= 0.7 ? 'warn' : '' });
    node.appendChild(svg('circle', { class: 'track', cx: size / 2, cy: size / 2, r }));
    node.appendChild(svg('circle', { class: 'arc', cx: size / 2, cy: size / 2, r, 'stroke-dasharray': c, 'stroke-dashoffset': c * (1 - share) }));
    return node;
  }

  const GAUGES = [
    ['rounds', 'Rounds', (g) => g.used + '/' + g.limit],
    ['attempts', 'attempts', (g) => g.used + '/' + g.limit],
    ['wallTime', 'wall time', (g) => duration(g.used) + '/' + g.limitText],
    ['spend', 'spend', (g) => '$' + g.used.toFixed(2) + '/$' + g.limit],
  ];

  // The Ledger's four mini rings, no words.
  function miniRings(b) {
    return el('span', { class: 'rings', 'data-role': 'rings', title: GAUGES.map(([k, name, text]) => name + ' ' + text(b[k])).join(' · ') }, GAUGES.map(([k]) => ring(b[k], 18)));
  }

  /** Pull a Trigger on a Ticket; Mark done met with a missing artifact offers to advance anyway through `onOverride`. */
  async function pullTrigger(t, action, body, onOverride) {
    if (action === 'check') { await api('/api/check-now', { method: 'POST' }); return; }
    try { await api('/api/tickets/' + encodeURIComponent(t.id) + '/' + action, { method: 'POST', body: JSON.stringify(body || {}) }); }
    catch (e) {
      if (e.status === 409 && e.body && e.body.override && onOverride) { onOverride(e.body); return; }
      throw e;
    }
  }

  // A Ledger row: status pill, reference over repo, title over the why line, the mini Metro track with the Stage
  // name, four mini rings, last activity, and the one quick action (spec: Ledger).
  function ticketRow(t) {
    const track = el('div', { class: 'track', 'data-role': 'track' });
    track.innerHTML = metroTrack(t);
    track.appendChild(el('span', { class: 'stage', 'data-role': 'stage-text', text: ledgerStageText(t) }));
    const quick = el('div', { class: 'quick', 'data-role': 'quick' });
    const action = quickAction(t);
    if (action) {
      const button = el('button', { type: 'button', class: 'sm' + (action.action === 'check' ? '' : ' primary'), text: action.label, 'data-action': action.action });
      button.addEventListener('click', async (ev) => {
        ev.stopPropagation();
        button.disabled = true; button.classList.add('busy');
        try { await pullTrigger(t, action.action, {}); await refreshLedger(); }
        catch (e) { showNotice(e.message); button.disabled = false; button.classList.remove('busy'); }
      });
      quick.appendChild(button);
    }
    const row = el('article', { class: 'ticket' + (t.state === 'active' ? '' : ' ended'), 'data-id': t.id }, [
      el('span', { class: 'pill ' + t.display.state, 'data-role': 'pill', text: t.display.label || t.display.state }),
      el('div', {}, [el('div', { class: 'ref', 'data-role': 'ref', text: t.reference || t.shortId }), el('div', { class: 'repo', text: t.repo })]),
      el('div', { class: 'title-cell' }, [el('div', { class: 'title', text: t.title }), el('div', { class: 'why', 'data-role': 'why', text: t.display.why })]),
      track,
      miniRings(t.budget),
      el('div', { class: 'last', 'data-role': 'last', title: t.updatedAt, text: relative(t.updatedAt) }),
      quick,
    ]);
    row.addEventListener('click', () => { location.hash = t.id; });
    return row;
  }

  const listTickets = () => api(showEnded.checked ? '/api/tickets?all=1' : '/api/tickets');
  const failing = (e) => showNotice(e.message);
  showEnded.addEventListener('change', () => { if (!ledger.hidden) refreshLedger().catch(failing); else if (!side.hidden && currentTicket) refreshSide(currentTicket).catch(failing); });

  async function refreshLedger() {
    // The API serves rows in Ledger order: attention first, newest activity within a group. Done and Abandoned
    // sit behind the toggle, greyed (CONTEXT.md: Ledger).
    const tickets = await listTickets();
    ledger.replaceChildren();
    if (!tickets.length) {
      ledger.appendChild(el('p', { class: 'empty', text: showEnded.checked ? 'No Tickets yet. Paste a reference or a prompt above to start one.' : 'No active Tickets. Paste a reference or a prompt above to start one.' }));
      return;
    }
    for (const t of tickets) ledger.appendChild(ticketRow(t));
  }

  // With a detail open the Ledger collapses to this sidebar: one compact line per Ticket, the open one marked.
  let currentTicket = null;
  async function refreshSide(id) { drawSide(await listTickets(), id); }
  function drawSide(tickets, id) {
    const back = el('div', { class: 'back' }, [el('a', { class: 'back-link', href: '#', text: '← all Tickets' }), el('span', { class: 'muted', text: tickets.length + ' shown' })]);
    side.replaceChildren(back, ...tickets.map((t) => {
      const item = el('div', { class: 'qitem' + (t.id === id ? ' sel' : '') + (t.state === 'active' ? '' : ' ended'), 'data-id': t.id }, [
        el('span', { class: 'dot ' + t.display.state }),
        el('div', { style: 'min-width:0' }, [el('div', { class: 'ref', text: (t.reference || t.shortId) + ' · ' + t.repo + ' · ' + t.stage.label }), el('div', { class: 'title', text: t.title })]),
      ]);
      item.addEventListener('click', () => { location.hash = t.id; });
      return item;
    }));
  }

  // The four ring gauges; any of them opens the inline Ticket-layer editor (Extend). A starred value is set on the Ticket.
  function gauges(t, openEditor) {
    return el('div', { class: 'gauges', 'data-role': 'gauges' }, GAUGES.map(([k, name, text]) => {
      const g = t.budget[k];
      const share = g.limit > 0 ? g.used / g.limit : 1;
      const node = el('div', { class: 'gauge' + (share >= 1 ? ' over' : share >= 0.7 ? ' warn' : ''), 'data-gauge': k, title: 'set ' + (g.source === 'ticket' ? 'on this Ticket' : g.source === 'pipeline' ? 'by the Pipeline' : 'globally') + '; click to extend' },
        [ring(g, 56), el('span', { class: 'value', text: text(g) + (g.source === 'ticket' ? '*' : '') }), el('span', { text: name })]);
      node.addEventListener('click', openEditor);
      return node;
    }));
  }

  function budgetEditor(t) {
    const form = el('form', { class: 'editor', 'data-role': 'budget-editor' });
    form.hidden = true;
    const fields = GAUGES.map(([k, name]) => {
      const g = t.budget[k];
      const input = el('input', { name: k, placeholder: k === 'wallTime' ? g.limitText : String(g.limit), value: t.budget.ticket[k] === null ? '' : String(t.budget.ticket[k]) });
      return [k, input, el('label', {}, [name + (k === 'spend' ? ' (USD)' : k === 'wallTime' ? ' (30m, 1h)' : ''), input])];
    });
    const save = el('button', { class: 'primary', type: 'submit', text: 'Save' });
    const cancel = el('button', { type: 'button', text: 'Cancel' });
    cancel.addEventListener('click', () => { form.hidden = true; });
    form.replaceChildren(...fields.map((f) => f[2]), el('div', { class: 'row' }, [save, cancel, el('span', { class: 'why', text: 'blank falls back to the Pipeline or global value; a running Session keeps the wall time it started with' })]));
    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const body = {};
      for (const [k, input] of fields) {
        const raw = input.value.trim();
        if (raw !== '' && k !== 'wallTime' && !/^\d+(\.\d+)?$/.test(raw)) { showNotice(k + ' must be a number'); input.focus(); return; }
        body[k] = raw === '' ? null : k === 'wallTime' ? raw : Number(raw);
      }
      save.disabled = true;
      try { await api('/api/tickets/' + encodeURIComponent(t.id) + '/extend', { method: 'POST', body: JSON.stringify(body) }); showDetail(t.id); }
      catch (e) { showNotice(e.message); save.disabled = false; }
    });
    return form;
  }

  // The Flag box: why, when, the last word from the Runner, and the six exits below it.
  function flagBox(t) {
    const last = t.session && t.session.finalMessage;
    return el('div', { class: 'flagbox', 'data-role': 'flagbox' }, [
      el('div', {}, [el('span', { class: 'reason', text: t.flag.reason }), ' ', el('span', { class: 'meta muted', text: 'Flagged ' + relative(t.flag.at) })]),
      el('div', { text: t.flag.detail || '' }),
      last ? el('div', { class: 'last', text: last }) : el('span'),
    ]);
  }

  function copyChip(label, value) {
    const chip = el('button', { type: 'button', text: label, title: value });
    chip.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(value); chip.textContent = 'copied'; }
      catch (e) { chip.textContent = value; }
      setTimeout(() => { chip.textContent = label; }, 1500);
    });
    return chip;
  }

  // Done and Abandon remove the worktree; the path stays on the Ticket as history.
  function worktreeGone(t) { return t.state !== 'active'; }
  function worktreeChip(t) {
    return worktreeGone(t) ? el('span', { class: 'muted', text: 'worktree removed', title: t.worktree }) : copyChip('worktree', t.worktree);
  }

  // Each showDetail is a generation; a pane whose generation has passed stops polling and never re-renders.
  let detailGen = 0;
  // The running Session whose output is on screen; "stdout" events for it read more.
  let watchedStdout = null;

  const sessionLabel = (s) => s.stage + ' #' + s.ordinal + (s.round ? ' · Round ' + s.round : '');

  /** The Feedback a Round addressed: one line per item, with the evidence it was addressed or "open". */
  function feedbackList(items) {
    if (!items || !items.length) return el('span');
    return el('div', { class: 'feedback', 'data-role': 'feedback' }, [
      el('h4', { text: 'Feedback' }),
      ...items.map((f) => el('div', { class: 'row' }, [
        el('span', { class: 'pill ' + (f.addressed ? 'succeeded' : 'flagged'), text: f.addressed ? 'addressed' : 'open' }),
        el('span', { class: 'kind', text: f.kind }),
        f.url ? el('a', { href: f.url, target: '_blank', rel: 'noopener', text: f.summary }) : el('span', { text: f.summary }),
        el('span', { class: 'meta', text: f.addressed || '' }),
      ])),
    ]);
  }

  function sessionPane(t, s, gen) {
    const pane = el('section', { class: 'session', 'data-role': 'session' });
    const outcome = s.running ? 'running' : (s.outcome || 'unknown');
    const profile = sessionProfile(s);
    const head = el('div', { class: 'head' }, [
      el('span', { class: 'pill ' + outcome, text: outcome + (s.endedReason ? ' · ' + s.endedReason : '') }),
      el('strong', { text: sessionLabel(s) }),
      el('span', { class: 'meta', text: s.mode + ' · ' + s.startedBy }),
      el('span', Object.assign({ class: 'meta', 'data-role': 'duration', text: duration(s.durationMs) }, s.running ? { 'data-since': s.startedAt } : {})),
      el('span', { class: 'meta', text: s.costUsd === null ? '' : '$' + s.costUsd.toFixed(2) }),
      profile ? el('span', { class: 'meta', 'data-role': 'profile', text: profile.text, title: profile.title }) : el('span'),
      el('span', { class: 'meta', text: 'started ' + relative(s.startedAt) }),
    ]);
    if (s.running && s.mode === 'headless') {
      const stop = el('button', { class: 'stop', type: 'button', text: 'Stop' });
      stop.addEventListener('click', async () => {
        stop.disabled = true;
        try { await api('/api/tickets/' + encodeURIComponent(t.id) + '/sessions/' + s.id + '/stop', { method: 'POST' }); showDetail(t.id); }
        catch (e) { showNotice(e.message); stop.disabled = false; }
      });
      head.appendChild(stop);
    }
    if (s.mode === 'terminal') {
      const opened = s.openedAt ? 'terminal opened ' + relative(s.openedAt) : 'not opened yet';
      if (s.running && t.triggers.some((x) => x.action === 'terminal')) {
        const reopen = el('button', { class: 'stop', type: 'button', text: 'Open terminal' });
        reopen.addEventListener('click', async () => {
          reopen.disabled = true;
          try { await api('/api/tickets/' + encodeURIComponent(t.id) + '/terminal', { method: 'POST', body: '{}' }); showDetail(t.id); }
          catch (e) { showNotice(e.message); reopen.disabled = false; }
        });
        head.appendChild(reopen);
      }
      pane.replaceChildren(head, el('div', { class: 'hint', text: opened + '. Lasso tracks this Session by its id only: the row ends when you mark the Stage done or skip it.' }),
        el('div', { class: 'paths' }, [worktreeChip(t), copyChip('session id', s.id), s.runnerSessionId ? copyChip('runner session', s.runnerSessionId) : el('span'), s.transcriptPath ? copyChip('transcript', s.transcriptPath) : el('span')]));
      return pane;
    }
    const final = el('div', { class: 'final' + (s.outcome === 'succeeded' ? ' ok' : ''), text: s.finalMessage || '' });
    final.hidden = !s.finalMessage;
    // A built-in action has no output; an Action from config is a command, and its output reads like a Runner's.
    if (s.mode === 'action' && !s.stdoutPath) {
      pane.replaceChildren(head, el('div', { class: 'hint', text: 'Lasso performed this Stage itself; there is no Runner output.' }), final);
      return pane;
    }
    const out = el('pre', { text: '' });
    const paths = el('div', { class: 'paths' }, [
      worktreeChip(t),
      s.stdoutPath ? copyChip('stdout', s.stdoutPath) : el('span'),
      s.runnerSessionId ? copyChip('runner session', s.runnerSessionId) : el('span'),
      s.transcriptPath ? copyChip('transcript', s.transcriptPath) : el('span'),
    ]);
    pane.replaceChildren(head, feedbackList(s.feedback), out, final, paths);

    // Read from where the last read stopped; a "stdout" event while a read is out asks for one more after it.
    let offset = 0, reading = false, again = false;
    async function tail() {
      if (reading) { again = true; return; }
      reading = true;
      try {
        const chunk = await api('/api/tickets/' + encodeURIComponent(t.id) + '/sessions/' + s.id + '/stdout?offset=' + offset);
        if (gen !== detailGen) return;
        if (chunk.text) showOutput(out, chunk.text);
        offset = chunk.offset;
      } catch (e) {
        if (gen === detailGen) showOutput(out, '\n[stdout unavailable: ' + e.message + ']');
      } finally { reading = false; }
      if (again && gen === detailGen) { again = false; tail(); }
    }
    watchedStdout = s.running ? { session: s.id, gen, read: tail } : null;
    tail();
    return pane;
  }

  // Runner output keeps only its newest OUTPUT_TAIL characters on the page: appending to one big text node
  // re-laid out megabytes every second. The whole log stays at the stdout path.
  const OUTPUT_TAIL = 200000;
  function showOutput(out, text) {
    const pinned = out.scrollTop + out.clientHeight >= out.scrollHeight - 24;
    if (text.length > OUTPUT_TAIL) { text = text.slice(-OUTPUT_TAIL); out.replaceChildren(); out.dataset.shown = 0; out.dataset.trimmed = ''; }
    out.append(text);
    let shown = Number(out.dataset.shown || 0) + text.length;
    while (shown > OUTPUT_TAIL) {
      const first = out.firstChild, excess = shown - OUTPUT_TAIL;
      if (first.length <= excess) { out.removeChild(first); shown -= first.length; } else { first.deleteData(0, excess); shown = OUTPUT_TAIL; }
      out.dataset.trimmed = '';
    }
    out.dataset.shown = shown;
    if (pinned) out.scrollTop = out.scrollHeight;
  }

  const OUTCOME_COLOUR = { succeeded: 'var(--good)', failed: 'var(--crit)', exhausted: 'var(--crit)', interrupted: 'var(--amber)' };

  // The Sessions timeline, newest first, action Stages included; a station click narrows it to one Stage.
  function timeline(t, focus, onFocus) {
    const sessions = sessionsForStage(t.sessions, focus);
    const head = el('div', { class: 'head' }, [el('h3', { text: 'Sessions' + (focus ? ' · ' + focus : '') })]);
    if (focus) {
      const all = el('button', { type: 'button', class: 'sm', 'data-role': 'stage-filter', text: 'All Stages' });
      all.addEventListener('click', () => onFocus(null));
      head.appendChild(all);
    }
    const list = el('ul', { class: 'timeline' }, sessions.map((s) => el('li', { style: '--c:' + (s.running ? 'var(--run)' : OUTCOME_COLOUR[s.outcome] || 'var(--muted)') }, [
      el('span', { class: 'when', text: relative(s.startedAt) }),
      el('span', { class: 'pill ' + (s.running ? 'running' : s.outcome || ''), text: s.running ? 'running' : (s.outcome || '?') }),
      el('span', { text: sessionLabel(s) }),
      el('span', { class: 'muted', text: s.mode + ' · ' + s.startedBy + (s.endedReason ? ' · ' + s.endedReason : '') + ' · ' + duration(s.durationMs) + (s.costUsd === null ? '' : ' · $' + s.costUsd.toFixed(2)) }),
    ])));
    return el('div', { class: 'panel', 'data-role': 'timeline' }, [head, sessions.length ? list : el('span', { class: 'muted', text: focus ? 'no Sessions of ' + focus + ' yet' : 'no Sessions yet' })]);
  }

  // The levers on this Ticket. Mark done met with a missing artifact offers to advance anyway, inline;
  // Extend opens the Budget editor; Abandon asks for a second click; Check PR now runs a tick.
  function triggerBar(t, openEditor) {
    const bar = el('div', { class: 'triggers', 'data-role': 'triggers' });
    const buttons = t.triggers.map((trigger) => {
      const primary = trigger.action === 'terminal' || trigger.action === 'start' || trigger.action === 'retry';
      const button = el('button', { type: 'button', text: trigger.label, class: 'sm' + (primary ? ' primary' : ''), 'data-action': trigger.action });
      // A lever on show that cannot be pulled (Resume on another Runner) stays disabled and says why below.
      if (trigger.unavailable) { button.disabled = true; button.dataset.unavailable = '1'; button.title = trigger.unavailable; return button; }
      if (trigger.action === 'extend') button.addEventListener('click', openEditor);
      else if (trigger.action === 'abandon') button.addEventListener('click', () => {
        if (button.dataset.armed) { pull('abandon', {}); return; }
        button.dataset.armed = '1'; button.textContent = 'Abandon for sure?';
        setTimeout(() => { delete button.dataset.armed; button.textContent = trigger.label; }, 4000);
      });
      else button.addEventListener('click', () => pull(trigger.action, {}));
      return button;
    });
    // Check PR now belongs to the repeating Stage: a tick there fetches Feedback and opens a Round (spec: the title bar).
    if (t.state === 'active' && t.pr && t.stage.repeat) {
      const check = el('button', { type: 'button', class: 'sm', 'data-role': 'check-pr', text: 'Check PR now' });
      check.addEventListener('click', () => pull('check', {}));
      buttons.push(check);
    }
    // "retry with…" on a Flagged Runner Stage: pick a profile in the drawer, which sets the Stage's override and retries.
    const stageProfile = (t.profiles || []).find((p) => p.stage === t.stage.name);
    if (t.flag && stageProfile && t.triggers.some((x) => x.action === 'retry')) {
      const retryWith = el('button', { type: 'button', class: 'sm', 'data-action': 'retry-with', 'data-role': 'retry-with', text: 'retry with…' });
      retryWith.addEventListener('click', () => openProfileDrawer(stageProfile.profile, {
        scope: t.repo,
        context: 'Retry Stage ' + t.stage.name + ' of Ticket ' + (t.reference || t.shortId) + ' under another profile; it stays this Stage\'s override until cleared',
        extra: (name) => ({ role: 'retry-with-choice', choices: [
          { role: 'profile-retry', primary: true, label: 'Retry ' + t.stage.name + ' with ' + name, act: async () => { await pullTrigger(t, 'retry', { profile: name }); showDetail(t.id); } },
        ] }),
      }));
      buttons.push(retryWith);
    }
    const why = t.triggers.filter((x) => x.unavailable).map((x) => el('div', { class: 'why', 'data-role': 'unavailable', text: x.label + ' is unavailable: ' + x.unavailable }));
    bar.replaceChildren(...buttons, ...why);
    async function pull(action, body) {
      for (const b of buttons) b.disabled = true;
      const pressed = buttons.find((b) => b.dataset.action === action || (action === 'check' && b.dataset.role === 'check-pr'));
      if (pressed) pressed.classList.add('busy');
      const idle = () => { for (const b of buttons) { b.disabled = !!b.dataset.unavailable; b.classList.remove('busy'); } };
      try {
        await pullTrigger(t, action, body, (problem) => {
          idle();
          const anyway = el('button', { type: 'button', class: 'sm', text: 'Advance anyway' });
          anyway.addEventListener('click', () => { anyway.disabled = true; pull(action, { override: true }); });
          bar.replaceChildren(...buttons, ...why, el('div', { class: 'override', 'data-role': 'override' }, [
            el('span', { text: 'artifact ' + problem.artifact + ' is missing: ' + problem.detail }), anyway]));
        });
        await showDetail(t.id);
      } catch (e) {
        idle();
        showNotice(e.message);
      }
    }
    return bar;
  }

  // Which station the timeline is narrowed to, per Ticket, so a refresh keeps it.
  const focusByTicket = {};

  // The Metro flow diagram in its panel; a station click narrows the timeline and marks the station.
  function flowPanel(t, onFocus) {
    const panel = el('div', { class: 'flow', 'data-role': 'flow' });
    const drawing = el('div');
    const legend = el('div', { class: 'legend', text: 'Filled stations are done, the ringed station is current, a stop sign is Flagged, ticks are action Stages. The orbit above a repeating Stage is PR feedback with Rounds used of Budget on its badge; a small orbit counts attempts. Click a station to filter Sessions.' });
    panel.replaceChildren(drawing, legend);
    panel.draw = (focus) => {
      drawing.innerHTML = metroDiagram(t, focus);
      for (const node of drawing.querySelectorAll('[data-stage]')) node.addEventListener('click', () => onFocus(node.dataset.stage === focus ? null : node.dataset.stage));
    };
    return panel;
  }

  function titleBar(t, openEditor) {
    const crumbs = el('div', { class: 'eyebrow' }, [el('span', { text: (t.reference || t.shortId) + ' · ' + t.repo + ' · ' + t.branch })]);
    if (t.pr) crumbs.append(' · ', el('a', { href: t.pr, target: '_blank', rel: 'noopener', 'data-role': 'pr-link', text: 'PR' }));
    const left = el('div', { style: 'min-width:0' }, [crumbs, el('h2', { text: t.title }), el('div', { class: 'why', text: t.display.why + (t.mirrorPending ? ' · tracker labels not written yet' : '') })]);
    const right = el('div', { class: 'right' }, [el('span', { class: 'pill ' + t.display.state, text: t.display.label })]);
    // A Flagged Ticket's exits live in its Flag box (spec: the Flag box); otherwise the triggers stand in the title bar.
    if (!t.flag) right.appendChild(triggerBar(t, openEditor));
    return el('div', { class: 'titlebar', 'data-role': 'titlebar' }, [left, right]);
  }

  async function showDetail(id) {
    const gen = ++detailGen;
    let t, list;
    // The Ticket and the sidebar arrive together, so the page changes once rather than in steps.
    try { [t, list] = await Promise.all([api('/api/tickets/' + encodeURIComponent(id)), listTickets()]); }
    catch (e) { showNotice(e.message); location.hash = ''; return; }
    if (gen !== detailGen) return;
    currentTicket = t.id;
    const editor = budgetEditor(t);
    const openEditor = () => { editor.hidden = false; editor.querySelector('input').focus(); };
    let timelineNode = null;
    const onFocus = (stage) => {
      focusByTicket[t.id] = stage;
      flow.draw(stage);
      const next = timeline(t, stage, onFocus);
      timelineNode.replaceWith(next);
      timelineNode = next;
    };
    const flow = flowPanel(t, onFocus);
    const focus = focusByTicket[t.id] && t.stages.some((s) => s.name === focusByTicket[t.id]) ? focusByTicket[t.id] : null;
    flow.draw(focus);
    timelineNode = timeline(t, focus, onFocus);
    const children = [titleBar(t, openEditor), flow];
    if (t.flag) { const box = flagBox(t); box.append(triggerBar(t, openEditor)); children.push(box); }
    const left = el('div', { class: 'stack' });
    if (t.session) left.appendChild(sessionPane(t, t.session, gen));
    else left.appendChild(el('div', { class: 'panel muted', text: 'No Session yet.' }));
    const profiles = stageProfilesPanel(t);
    if (profiles) left.appendChild(profiles);
    left.appendChild(el('dl', {}, [
      el('dt', { text: 'worktree' }), el('dd', { text: worktreeGone(t) ? t.worktree + ' (removed)' : t.worktree }),
      el('dt', { text: 'pipeline' }), pipelineCell(t),
      el('dt', { text: 'id' }), el('dd', { text: t.id }),
    ]));
    const right = el('div', { class: 'stack' }, [
      el('div', { class: 'panel' }, [el('h3', { text: 'Budget' }), gauges(t, openEditor), editor]),
      timelineNode,
    ]);
    children.push(el('div', { class: 'dgrid' }, [left, right]));
    detail.replaceChildren(...children);
    drawSide(list, t.id);
    ledger.hidden = true; ledgerTools.hidden = true; pipelinesPanel.hidden = true; configPanel.hidden = true; detail.hidden = false;
    side.hidden = false; layout.classList.add('open');
  }

  // Each Runner Stage of an active Ticket that isn't done, with the profile its next Session runs under (LASSO-75). The
  // button opens the profile drawer on the Ticket's repo; "Use <profile> for this Ticket's <stage>" sets the Stage's
  // override, which wins over the Pipeline's choice from the next Session until "Clear override". Null when none.
  function stageProfilesPanel(t) {
    if (t.state !== 'active') return null;
    const rows = (t.profiles || []).filter((p) => t.stages.findIndex((s) => s.name === p.stage) >= t.stage.index);
    if (!rows.length) return null;
    return el('div', { class: 'panel', 'data-role': 'stage-profiles' }, [
      el('h3', { text: 'Agent Profiles' }),
      el('div', { class: 'stage-profiles' }, rows.map((p) => el('div', {}, [el('div', { class: 'stage-name', text: p.stage }), ticketStageProfileButton(t, p)]))),
      el('div', { class: 'why', text: 'an override applies from the Stage\'s next Session, retries and Rounds included; a running Session keeps its own' }),
    ]);
  }
  function ticketStageProfileButton(t, p) {
    const v = ticketProfileView(p);
    const button = el('button', { type: 'button', class: 'pf-pickbtn', 'data-role': 'ticket-stage-profile', 'data-stage': p.stage }, [
      el('span', { class: 'pf-pickname' }, [v.label + '  ✎', ...(v.overridden ? [el('span', { class: 'pf-overridden', 'data-role': 'overridden', text: 'overridden' })] : [])]),
      el('span', { class: 'pf-summary', 'data-role': 'stage-profile-headless', text: 'headless  ' + v.headless }),
      el('span', { class: 'pf-summary', 'data-role': 'stage-profile-human', text: 'human     ' + v.human }),
    ]);
    const route = '/api/tickets/' + encodeURIComponent(t.id) + '/stages/' + encodeURIComponent(p.stage) + '/profile';
    // The drawer closes once either choice is written.
    const chose = (init) => async () => { await api(route, init); showDetail(t.id); };
    button.addEventListener('click', () => openProfileDrawer(v.name, {
      scope: t.repo,
      context: 'Stage ' + p.stage + ' of Ticket ' + (t.reference || t.shortId),
      extra: (name) => ({ role: 'ticket-profile-choice', why: 'this Ticket only; applies from the Stage\'s next Session', choices: [
        { role: 'profile-use', primary: true, label: 'Use ' + name + ' for this Ticket\'s ' + p.stage, act: chose({ method: 'PUT', body: JSON.stringify({ profile: name }) }) },
        { role: 'profile-clear', label: 'Clear override', hidden: !v.overridden, act: chose({ method: 'DELETE' }) },
      ] }),
      onChange: () => showDetail(t.id),
    }));
    return button;
  }

  // The Pipeline a Ticket runs: its Version, linked read-only, and a note when the file has moved on (ADR 0009).
  const DRIFT_NOTE = { changed: 'Pipeline has changed', deleted: 'Pipeline deleted', broken: 'Pipeline file does not load' };
  function pipelineCell(t) {
    if (t.pipelineVersion === null) return el('dd', { text: t.pipeline });
    const link = el('a', { href: '#pipelines/' + encodeURIComponent(t.pipeline) + '/v' + t.pipelineVersion, text: t.pipeline + ' v' + t.pipelineVersion });
    const note = DRIFT_NOTE[t.pipelineDrift];
    return el('dd', { 'data-role': 'pipeline-version' }, note ? [link, el('span', { class: 'drift', text: ' · ' + note })] : [link]);
  }

  function field(label, input, wide) { return el('label', { class: wide ? 'wide' : '' }, [label, input]); }
  function check(label, name, on) {
    const input = el('input', { type: 'checkbox', name });
    input.checked = on;
    return [input, el('label', { class: 'check' }, [input, label])];
  }
  // The Agent Profiles config.yaml defines, by name; blank inherits. A name config lacks stays pickable so the form shows it.
  // Filling an existing select again (after the drawer adds or deletes a profile) keeps what it shows.
  function profileOptions(s, value, names, blank) {
    const all = value && !names.includes(value) ? [value, ...names] : names;
    s.replaceChildren(el('option', { value: '', text: blank }), ...all.map((r) => el('option', { value: r, text: names.includes(r) ? r : r + ' (not in config.yaml)' })));
    s.value = value || '';
    return s;
  }
  // A blank clears the key; a number field must hold a number; unchanged fields stay out of the patch.
  function changed(patch, key, before, after) { if (before !== after) patch[key] = after; }
  function numberOrNull(input, what) {
    const raw = input.value.trim();
    if (raw === '') return null;
    if (!/^\d+(\.\d+)?$/.test(raw)) { const e = new Error(what + ' must be a number'); e.input = input; throw e; }
    return Number(raw);
  }
  function prune(patch) {
    for (const [k, v] of Object.entries(patch)) {
      if (v && typeof v === 'object' && !Array.isArray(v)) { prune(v); if (!Object.keys(v).length) delete patch[k]; }
    }
    return patch;
  }
  // Runs an edit; `act` returning false means nothing was sent, so nothing follows.
  async function save(button, act, then) {
    button.disabled = true; button.classList.add('busy'); showNotice('');
    const idle = () => { button.disabled = false; button.classList.remove('busy'); };
    try { if ((await act()) !== false) then(); else idle(); }
    catch (e) { showNotice(e.message); if (e.input) e.input.focus(); idle(); }
  }

  // One Stage drawn on the line without its fields: a station, then a head naming the Stage and its kind.
  function railStage(kind, name, children, open, attrs = {}) {
    const station = el('span', { class: 'station', 'aria-hidden': 'true' });
    const nm = el('span', { class: 'nm', text: name });
    const chip = el('span', { class: 'kind', text: KIND_LABEL[kind] });
    const sum = el('span', { class: 'sum' });
    const peek = el('span', { class: 'peek' });
    const toggle = el('button', { type: 'button', class: 'stage-toggle', 'aria-expanded': 'false' }, [nm, chip, sum, peek]);
    const fields = el('div', { class: 'stage-fields' }, children);
    const node = el('div', Object.assign({ class: 'stage k-' + kind }, attrs), [station, el('div', { class: 'stage-box' }, [el('h3', {}, [toggle]), fields])]);
    const shell = {
      node, station,
      isOpen: () => !fields.hidden,
      setOpen(on) { node.classList.toggle('open', on); fields.hidden = !on; toggle.setAttribute('aria-expanded', String(on)); },
      label(text, kindNow, summary, prompt) {
        nm.textContent = text;
        for (const k of Object.keys(KIND_LABEL)) node.classList.toggle('k-' + k, k === kindNow);
        chip.textContent = KIND_LABEL[kindNow];
        sum.textContent = summary;
        peek.textContent = prompt;
        peek.hidden = !prompt;
      },
    };
    toggle.addEventListener('click', () => shell.setOpen(fields.hidden));
    shell.setOpen(open);
    return shell;
  }
  const KIND_LABEL = { runner: 'Runner', human: 'Human', action: 'Action' };
  const firstLine = (text) => (text || '').split('\n').find((l) => l.trim()) || '';
  function stagesHead(onExpand) {
    const key = (text, colour, bar) => el('span', {}, [el('i', { class: bar ? 'bar' : '', style: '--k:' + colour }), text]);
    const expand = el('button', { type: 'button', class: 'sm quiet', text: 'Expand all' });
    if (onExpand) expand.addEventListener('click', () => { expand.textContent = onExpand() ? 'Collapse all' : 'Expand all'; });
    return el('div', { class: 'stages-head' }, [el('h3', { text: 'Stages' }), el('div', { class: 'legend' }, [key('Runner', 'var(--run)'), key('Human', 'var(--amber)'), key('Action', 'var(--muted)', true), ...(onExpand ? [expand] : [])])]);
  }

  // A save bar for a form: the button, whether anything waits to be saved, and a note. markDirty() flips it to unsaved.
  function saveBar(form, button, note) {
    const state = el('span', { class: 'state', text: 'No unsaved changes' });
    const markDirty = () => { form.classList.add('dirty'); state.textContent = 'Unsaved changes'; };
    form.addEventListener('input', markDirty);
    form.addEventListener('change', markDirty);
    return { node: el('div', { class: 'savebar' }, [button, state, el('span', { class: 'why', text: note })]), markDirty };
  }

  // The Stage editor, which the React Pipelines page mounts (app/pipelines/StagesForm.tsx) until LASSO-80 moves it to
  // React. Each build reads Actions and config afresh; `saved` has the page read the file again after a Save.
  adoptOldStagesForm(async (p, saved) => {
    const actions = await api('/api/actions').catch(() => []);
    const config = await api('/api/config').then((c) => c.config).catch(() => ({ profiles: {}, default_profile: null, budget: {} }));
    // What the Pipeline and Stage cards share about profiles: config as last read (a drawer save refreshes it),
    // the Pipeline dropdown's choice, each card's redraw, run when either changes, and touched(), which marks the form unsaved.
    const profiles = { config, pipeline: p.name, chosen: () => null, redraws: [], touched: () => {}, changed(next) { if (next) this.config = next; for (const r of this.redraws) r(); } };
    return stagesForm(p, actions, profiles, saved);
  });

  function stagesForm(p, actions, profiles, saved) {
    const pipeline = p.pipeline;
    const defaults = profiles.config.budget || {};
    // Each configured Action's params, by name; a global one stands ahead of a repo's own of the same name.
    const params = {};
    for (const a of actions) if (!params[a.name]) params[a.name] = a.params;
    const form = el('form', { class: 'pipe-form', 'data-role': 'pipeline-fields' });
    // The Pipeline's profile: blank leaves its Stages to config's default_profile. A change redraws each Stage's button.
    const profile = el('select', { name: 'profile', 'data-role': 'pipeline-profile' });
    const fillProfile = () => profileOptions(profile, profile.dataset.drawn ? profile.value : pipeline.profile, Object.keys(profiles.config.profiles).sort(), 'config default (' + (profiles.config.default_profile || 'none') + ')');
    fillProfile();
    profile.dataset.drawn = '1';
    profiles.chosen = () => profile.value || null;
    profiles.redraws.push(fillProfile);
    profile.addEventListener('change', () => profiles.changed());
    const spend = el('input', { name: 'spend', value: pipeline.budget.spend === undefined ? '' : String(pipeline.budget.spend), placeholder: defaults.spend === undefined ? 'global default' : 'global default (' + defaults.spend + ')' });
    form.appendChild(el('section', { class: 'sheet pipe-settings' }, [
      el('h3', { text: 'Pipeline settings' }),
      el('p', { class: 'about', text: 'Defaults for every Stage below. A Stage can pick its own Agent Profile.' }),
      el('div', { class: 'fields' }, [field('Agent Profile', profile), field('Spend limit per Ticket (USD)', spend)]),
    ]));
    // The Stages as they will be saved: additions, moves and removals wait for Save, and undo brings a Stage back as it was.
    const stages = pipeline.stages.map((s) => withTools(stageCard(s, pipeline, false, params, profiles)));
    const toggleAll = () => { const open = stages.some((c) => !c.isOpen()); for (const c of stages) c.setOpen(open); return open; };
    form.appendChild(stagesHead(toggleAll));
    const list = el('div', { class: 'rail', 'data-role': 'stage-list' });
    const button = el('button', { class: 'primary', type: 'submit', text: 'Save changes' });
    const bar = saveBar(form, button, 'Blank fields fall back to their defaults. Added, moved and removed Stages apply on Save.');
    profiles.touched = bar.markDirty;
    let drawn = false;
    const draw = () => {
      const kept = stages.filter((c) => !c.removed).length;
      let n = 0;
      stages.forEach((card, i) => {
        card.up.style.visibility = i === 0 ? 'hidden' : '';
        card.down.style.visibility = i === stages.length - 1 ? 'hidden' : '';
        card.node.classList.toggle('removed', !!card.removed);
        card.station.textContent = card.removed ? '' : String(++n);
        card.remove.textContent = card.removed ? 'Undo' : '✕';
        card.remove.title = card.removed ? 'keep this Stage' : kept === 1 ? 'a Pipeline keeps at least one Stage' : card.fresh ? 'drop this new Stage' : 'remove this Stage on Save';
        card.remove.disabled = !card.removed && kept === 1;
      });
      list.replaceChildren(...stages.flatMap((c) => [c.node, addButton(c)]));
      if (drawn) bar.markDirty();
      drawn = true;
    };
    const move = (card, by) => {
      const from = stages.indexOf(card);
      stages.splice(from, 1);
      stages.splice(from + by, 0, card);
      draw();
    };
    // A new Stage goes in after the card whose button was pressed, blank until the human fills it in; "+" asks which kind first.
    function addButton(after) {
      const box = el('div', { class: 'add-stage' });
      const choose = el('button', { type: 'button', 'data-role': 'add-stage', title: 'add a Stage here', 'aria-label': 'add a Stage after ' + (after.name || 'the new Stage'), text: '+' });
      const kinds = [['Runner Stage', 'add-runner', BLANK_STAGE], ['Action Stage', 'add-action', BLANK_ACTION]].map(([text, role, blank]) => {
        const b = el('button', { type: 'button', class: 'sm add-k', 'data-role': role, text: '+ ' + text });
        b.addEventListener('click', () => {
          const card = withTools(stageCard(blank, pipeline, true, params, profiles));
          card.fresh = true;
          card.node.classList.add('fresh');
          stages.splice(stages.indexOf(after) + 1, 0, card);
          draw();
          card.node.querySelector('.stage-fields input, .stage-fields select').focus();
        });
        return b;
      });
      const cancel = el('button', { type: 'button', class: 'sm quiet', 'data-role': 'add-cancel', title: 'add nothing', text: 'Cancel' });
      choose.addEventListener('click', () => box.replaceChildren(...kinds, cancel));
      cancel.addEventListener('click', () => box.replaceChildren(choose));
      box.append(choose);
      return box;
    }
    function withTools(card) {
      const label = card.name || 'the new Stage';
      card.up = el('button', { type: 'button', class: 'sm', 'data-role': 'move-up', title: 'run this Stage earlier', 'aria-label': 'move ' + label + ' up', text: '↑' });
      card.down = el('button', { type: 'button', class: 'sm', 'data-role': 'move-down', title: 'run this Stage later', 'aria-label': 'move ' + label + ' down', text: '↓' });
      card.remove = el('button', { type: 'button', class: 'sm', 'data-role': 'remove-stage' });
      card.up.addEventListener('click', () => move(card, -1));
      card.down.addEventListener('click', () => move(card, 1));
      card.remove.addEventListener('click', () => {
        if (card.fresh) stages.splice(stages.indexOf(card), 1);
        else card.removed = !card.removed;
        draw();
      });
      card.node.querySelector('h3').append(el('span', { class: 'removed-note', text: 'removed on Save' }), el('span', { class: 'tools' }, [card.up, card.down, card.remove]));
      return card;
    }
    draw();
    form.appendChild(list);
    form.appendChild(bar.node);
    form.addEventListener('submit', (ev) => {
      ev.preventDefault();
      save(button, async () => {
        const patch = { budget: {}, stages: {} };
        if (profile.value !== (pipeline.profile || '')) patch.profile = profile.value || null;
        changed(patch.budget, 'spend', pipeline.budget.spend === undefined ? null : pipeline.budget.spend, numberOrNull(spend, 'spend'));
        const kept = stages.filter((c) => !c.removed);
        for (const card of kept) { if (card.fresh) continue; const sp = card.patch(); if (Object.keys(sp).length) patch.stages[card.name] = sp; }
        prune(patch);
        // A new Stage goes in the order as its fields: what its card sets, against a blank Stage.
        const order = kept.map((c) => (c.fresh ? c.patch() : c.name));
        if (kept.some((c) => c.fresh) || order.join('\n') !== pipeline.stages.map((s) => s.name).join('\n')) patch.order = order;
        if (!Object.keys(patch).length) { showNotice('nothing changed'); return false; }
        await api('/api/pipelines/' + encodeURIComponent(p.name), { method: 'PATCH', body: JSON.stringify(patch) });
      }, () => { showNotice('saved ' + p.name); saved(); });
    });
    return form;
  }

  // What a new Stage starts as: every field at its default.
  const BLANK_STAGE = { kind: 'runner', name: '', prompt: null, skills: [], profile: null, human: false, advance: true, artifact: null, repeat: null, budget: {} };
  const BLANK_ACTION = { kind: 'action', name: '', action: '', with: {} };

  // params: each Action config.yaml defines, by name, with the params a Stage supplies under with: (ADR 0010).
  // profiles: the editor's shared profile context (adoptOldStagesForm above), so the profile button resolves what a Stage inherits.
  // A card starts closed to one summary line, except a new Stage, which opens ready to fill in.
  function stageCard(s, pipeline, fresh, params = {}, profiles) {
    if (s.kind === 'action') {
      // The Action is picked from config and shows one field per param; a Stage naming an Action config lacks keeps its own params.
      const names = Object.keys(params).sort();
      if (s.action && !names.includes(s.action)) names.unshift(s.action);
      const action = select('action', names, s.action);
      if (s.action && !params[s.action]) action.querySelector('option').textContent = s.action + ' (not in config.yaml)';
      const keysOf = (name) => params[name] || (name === s.action ? Object.keys(s.with) : []);
      const inputs = {};
      const fields = el('div', { class: 'fields' });
      const shell = railStage('action', s.name, [fields], fresh, { 'data-role': 'action-stage' });
      const summarize = () => {
        const keys = keysOf(action.value);
        shell.label(fresh ? 'New Stage' : s.name, 'action', [action.value || 'no Action picked', ...keys.map((key) => key + ': ' + (inputs[key].value.trim() || '(blank)'))].join(', '), '');
      };
      const drawFields = () => {
        const keys = keysOf(action.value);
        for (const key of keys) inputs[key] = inputs[key] || el('input', { name: key, value: s.with[key] || '', placeholder: 'required' });
        fields.replaceChildren(field('Action', action), ...keys.map((key) => field(key, inputs[key])));
        if (!names.length) fields.append(el('div', { class: 'why', text: 'config.yaml defines no Actions yet; add one under actions: to run it here' }));
        summarize();
      };
      action.addEventListener('change', drawFields);
      fields.addEventListener('input', summarize);
      drawFields();
      const values = () => Object.fromEntries(keysOf(action.value).map((key) => [key, inputs[key].value.trim()]));
      return {
        name: s.name, node: shell.node, station: shell.station, isOpen: shell.isOpen, setOpen: shell.setOpen,
        // A param left blank is left out, so the save names it as missing.
        patch() {
          const next = values();
          if (fresh) return { action: action.value, with: Object.fromEntries(Object.entries(next).filter(([, value]) => value)) };
          const patch = {};
          if (action.value !== s.action) patch.action = action.value;
          const w = {};
          for (const [key, value] of Object.entries(next)) if (value !== s.with[key]) w[key] = value || null;
          for (const key of Object.keys(s.with)) if (!(key in next)) w[key] = null;
          if (Object.keys(w).length) patch.with = w;
          return patch;
        },
      };
    }
    const defaults = profiles.config.budget || {};
    const byDefault = (v) => (v === undefined ? 'default' : 'default (' + v + ')');
    const name = el('input', { name: 'name', value: s.name, placeholder: 'implement' });
    const prompt = el('textarea', { name: 'prompt', placeholder: 'What the agent should do in this Stage' }); prompt.value = s.prompt || '';
    const skills = el('input', { name: 'skills', value: s.skills.join(', '), placeholder: 'grilling, to-spec' });
    const profile = stageProfileButton(s, name, profiles);
    const artifact = el('input', { name: 'artifact', value: s.artifact || '', placeholder: 'commits-on-branch, file NOTES.md' });
    const [human, humanLabel] = check('Human Stage: opens a terminal for you to work in', 'human', s.human);
    const [advance, advanceLabel] = check('Move to the next Stage on its own', 'advance', s.advance);
    const [repeat, repeatLabel] = check('Repeat on Feedback until the artifact is met', 'repeat', s.repeat === 'feedback');
    const rounds = el('input', { name: 'rounds', value: s.budget.rounds === undefined ? '' : String(s.budget.rounds), placeholder: byDefault(defaults.rounds) });
    const attempts = el('input', { name: 'attempts', value: s.budget.attempts === undefined ? '' : String(s.budget.attempts), placeholder: byDefault(defaults.attempts) });
    const wallTime = el('input', { name: 'wallTime', value: s.budget.wallTime || '', placeholder: byDefault(defaults.wallTime) });
    for (const label of [humanLabel, advanceLabel, repeatLabel]) label.classList.add('wide');
    const group = (title, children) => el('div', { class: 'fgroup' }, [el('h4', { text: title }), el('div', { class: 'fields' }, children)]);
    const shell = railStage(s.human ? 'human' : 'runner', s.name || 'New Stage', [
      group('Task', [field('Name', name), field('Skills', skills), field('Prompt', prompt, true)]),
      group('Runs as', [field('Agent Profile', profile.node, true), humanLabel]),
      group('Done when', [field('Artifact', artifact, true), advanceLabel, repeatLabel]),
      group('Limits', [field('Feedback rounds', rounds), field('Attempts', attempts), field('Time per Session', wallTime)]),
    ], fresh);
    // The closed card's line: who runs it, what it leaves behind, and anything unusual about how it moves on.
    const summarize = () => {
      const v = stageProfileView(profile.chosen(), profiles.chosen(), profiles.config);
      const bits = [v.name || 'no profile', artifact.value.trim() ? 'leaves ' + artifact.value.trim() : 'no artifact'];
      if (repeat.checked) bits.push('repeats on Feedback');
      if (!advance.checked) bits.push('waits for Start');
      shell.label(name.value.trim() || 'New Stage', human.checked ? 'human' : 'runner', bits.join(', '), firstLine(prompt.value));
    };
    shell.node.addEventListener('input', summarize);
    shell.node.addEventListener('change', summarize);
    profiles.redraws.push(summarize);
    summarize();
    return {
      name: s.name, node: shell.node, station: shell.station, isOpen: shell.isOpen, setOpen: shell.setOpen,
      patch() {
        const patch = { budget: {} };
        changed(patch, 'name', s.name, name.value.trim());
        changed(patch, 'prompt', s.prompt, prompt.value === '' ? null : prompt.value);
        const list = skills.value.split(',').map((x) => x.trim()).filter(Boolean);
        if (list.join(',') !== s.skills.join(',')) patch.skills = list.length ? list : null;
        if (profile.chosen() !== s.profile) patch.profile = profile.chosen();
        changed(patch, 'artifact', s.artifact, artifact.value.trim() === '' ? null : artifact.value.trim());
        if (human.checked !== s.human) patch.human = human.checked ? true : null;
        if (advance.checked !== s.advance) patch.advance = advance.checked ? null : false;
        if (repeat.checked !== (s.repeat === 'feedback')) patch.repeat = repeat.checked ? 'feedback' : null;
        changed(patch.budget, 'rounds', s.budget.rounds === undefined ? null : s.budget.rounds, numberOrNull(rounds, 'rounds'));
        changed(patch.budget, 'attempts', s.budget.attempts === undefined ? null : s.budget.attempts, numberOrNull(attempts, 'attempts'));
        changed(patch.budget, 'wallTime', s.budget.wallTime === undefined ? null : s.budget.wallTime, wallTime.value.trim() === '' ? null : wallTime.value.trim());
        return prune(patch);
      },
    };
  }

  // A Runner Stage's profile: a button naming what it runs ("inherit → <profile>" when it names none) over each
  // mode's resolved line. It opens the profile drawer, which edits profiles at once; "Use <profile> for <stage>" and
  // "Inherit instead" only change this card, and the Pipeline's Save writes them, like every other field here.
  // The Pipeline editor has no repo, so what it shows resolves against the global profiles and default_profile.
  function stageProfileButton(s, nameInput, profiles) {
    let chosen = s.profile;
    const button = el('button', { type: 'button', class: 'pf-pickbtn', 'data-role': 'stage-profile', title: 'resolved from config.yaml\'s global profiles; a repo\'s own default_profile or override may differ' });
    const draw = () => {
      const v = stageProfileView(chosen, profiles.chosen(), profiles.config);
      button.replaceChildren(
        el('span', { class: 'pf-pickname', text: v.label + '  ✎' + (chosen !== s.profile ? '  (unsaved)' : '') }),
        el('span', { class: 'pf-summary', 'data-role': 'stage-profile-headless', text: 'headless  ' + v.headless }),
        el('span', { class: 'pf-summary', 'data-role': 'stage-profile-human', text: 'human     ' + v.human }),
      );
    };
    // The drawer asks before dropping unsaved profile edits, and closes once a choice is made.
    const choose = (name) => {
      chosen = name;
      draw();
      profiles.touched();
    };
    button.addEventListener('click', (ev) => {
      ev.preventDefault();
      const stage = nameInput.value.trim() || 'the new Stage';
      openProfileDrawer(stageProfileView(chosen, profiles.chosen(), profiles.config).name, {
        context: 'Stage ' + stage + ' of Pipeline ' + profiles.pipeline,
        extra: (name) => ({ role: 'stage-profile-choice', why: 'sets this Stage in the editor; the Pipeline\'s Save writes it', choices: [
          { role: 'profile-use', primary: true, label: 'Use ' + name + ' for ' + stage, act: () => choose(name) },
          { role: 'profile-inherit', label: 'Inherit instead', act: () => choose(null) },
        ] }),
        onChange: (config) => profiles.changed(config),
      });
    });
    profiles.redraws.push(draw);
    draw();
    return { node: button, chosen: () => chosen };
  }

  function decodeName(part) { try { return decodeURIComponent(part); } catch { return part; } }
  function route() {
    const hash = location.hash.replace(/^#/, '');
    detailGen++;
    const view = hash === 'config' ? 'config' : hash === 'pipelines' || hash.startsWith('pipelines/') ? 'pipelines' : hash ? 'detail' : 'ledger';
    for (const a of document.querySelectorAll('nav.views a')) a.classList.toggle('on', (a.getAttribute('href').slice(1) || 'ledger') === (view === 'detail' ? 'ledger' : view));
    // A Ticket's page swaps itself in once its data is here, rather than showing the last one meanwhile.
    if (view === 'detail') { showDetail(hash); return; }
    ledger.hidden = view !== 'ledger'; ledgerTools.hidden = view !== 'ledger'; detail.hidden = view !== 'detail'; pipelinesPanel.hidden = view !== 'pipelines'; configPanel.hidden = view !== 'config';
    side.hidden = true; layout.classList.remove('open'); currentTicket = null;
    if (view === 'pipelines') {
      const rest = hash.startsWith('pipelines/') ? decodeName(hash.slice('pipelines/'.length)) : null;
      const m = rest && /^(.+)\/v(\d+)$/.exec(rest);
      showPipelines(pipelinesPanel, m ? m[1] : rest, m ? Number(m[2]) : null);
    }
    else if (view === 'config') showConfig(configPanel);
    else refreshLedger().catch(failing);
  }

  function select(name, choices, suggestion) {
    const s = el('select', { name });
    if (!suggestion) s.appendChild(el('option', { value: '', text: 'pick one' }));
    for (const c of choices) { const o = el('option', { value: c, text: c }); if (c === suggestion) o.selected = true; s.appendChild(o); }
    return s;
  }

  intakeForm.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const input = intakeForm.elements.input.value.trim();
    if (!input) return;
    showNotice('');
    try {
      const d = await api('/api/intake/detect', { method: 'POST', body: JSON.stringify({ input }) });
      const repoSelect = select('repo', d.repo.choices, d.repo.suggestion);
      const pipelineSelect = select('pipeline', d.pipeline.choices, d.pipeline.suggestion);
      const notes = el('div', { class: 'notes' });
      const showNotes = (list) => notes.replaceChildren(...list.map((n) => el('div', { class: 'why', text: n })));
      showNotes(d.notes);
      repoSelect.addEventListener('change', async () => {
        // The Pipeline default follows the repo: re-pick it whenever the repo changes.
        const p = d.pipeline.byRepo[repoSelect.value];
        if (p) pipelineSelect.value = p;
        // A reference's branch depends on the repo: re-detect for the chosen repo to refresh the notes.
        if (!d.reference) return;
        showNotes([]);
        try {
          const again = await api('/api/intake/detect', { method: 'POST', body: JSON.stringify({ input, repo: repoSelect.value }) });
          showNotes(again.notes);
        } catch (e) { showNotice(e.message); }
      });
      confirmPanel.replaceChildren(
        el('div', { class: 'kind', text: d.kind + (d.reference ? ' ' + d.reference : '') }),
        el('div', { text: d.title || input }),
        el('div', { class: 'row' }, [el('label', { text: 'repo' }), repoSelect, el('label', { text: 'pipeline' }), pipelineSelect]),
        notes,
        el('div', { class: 'row' }, [el('button', { class: 'primary', type: 'submit', text: 'Confirm' }), el('button', { type: 'button', 'data-role': 'cancel', text: 'Cancel' })]),
      );
      confirmPanel.dataset.input = input;
      confirmPanel.hidden = false;
      confirmPanel.querySelector('[data-role="cancel"]').addEventListener('click', () => { confirmPanel.hidden = true; });
    } catch (e) { showNotice(e.message); }
  });

  confirmPanel.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const repo = confirmPanel.elements.repo.value;
    if (!repo) { showNotice('repo is ambiguous: pick one'); return; }
    try {
      const t = await api('/api/tickets', { method: 'POST', body: JSON.stringify({ input: confirmPanel.dataset.input, repo, pipeline: confirmPanel.elements.pipeline.value }) });
      confirmPanel.hidden = true;
      intakeForm.reset();
      if (t.branchExisted) showNotice('checked out existing branch ' + t.branch);
      location.hash = '';
      await refreshLedger();
    } catch (e) { showNotice(e.message); }
  });

  $('[data-role="check-now"]').addEventListener('click', async () => {
    // The click shows at once rather than waiting on the server's tick event.
    if (typeof tickNow === 'object') pulseTick();
    try {
      const tick = await api('/api/check-now', { method: 'POST' });
      showNotice(tick.changes.length ? tick.changes.map((c) => c.summary).join('; ') : 'nothing new');
      await refreshTick(); route();
    }
    catch (e) { showNotice(e.message); }
  });

  window.addEventListener('hashchange', route);
  route();

  // A Ticket's page is redrawn when it changes, unless the user is partway through something on it.
  function busyOnDetail() {
    if (detail.querySelector('[data-role="override"], [data-armed], button.busy')) return true;
    const editor = detail.querySelector('[data-role="budget-editor"]');
    if (editor && !editor.hidden) return true;
    const focused = document.activeElement;
    return !!(focused && detail.contains(focused) && /^(INPUT|TEXTAREA|SELECT)$/.test(focused.tagName));
  }

  // Changes arrive from /api/events and are acted on together after a short pause, so a burst redraws once.
  const owed = { list: false, tickets: new Set() };
  let owedTimer = null;
  function settleOwed() {
    owedTimer = null;
    const { list, tickets } = owed;
    owed.list = false; owed.tickets = new Set();
    if (!ledger.hidden) { if (list) refreshLedger().catch(failing); return; }
    if (detail.hidden || !currentTicket) return;
    if (tickets.has(currentTicket) && !busyOnDetail()) showDetail(currentTicket);
    else if (list) refreshSide(currentTicket).catch(failing);
  }
  function owe(ticket) {
    owed.list = true;
    if (ticket) owed.tickets.add(ticket);
    owedTimer ??= setTimeout(settleOwed, 100);
  }

  // Server-Sent Events: the server names what changed and the page re-reads it. EventSource reconnects on its
  // own after a restart; anything missed meanwhile is caught by re-reading everything once it is back.
  let everOpen = false;
  function listen() {
    const source = events();
    source.addEventListener('hello', (ev) => {
      showTick(JSON.parse(ev.data));
      if (everOpen) route();
      everOpen = true;
    });
    source.addEventListener('tick', (ev) => showTick(JSON.parse(ev.data)));
    source.addEventListener('ticket', (ev) => owe(JSON.parse(ev.data).ticket));
    source.addEventListener('stdout', (ev) => {
      const { session } = JSON.parse(ev.data);
      if (watchedStdout && watchedStdout.session === session && watchedStdout.gen === detailGen) watchedStdout.read();
    });
    source.addEventListener('error', lostLasso);
  }
  listen();

  // The clock: countdowns and running durations move on screen without asking the server.
  setInterval(() => {
    drawTick();
    for (const node of document.querySelectorAll('[data-role="duration"][data-since]')) node.textContent = duration(Date.now() - new Date(node.dataset.since).getTime());
    for (const node of document.querySelectorAll('[data-role="last"][title]')) node.textContent = relative(node.title);
  }, 1000);
})();
</script>
</body>
</html>
