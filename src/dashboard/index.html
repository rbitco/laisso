<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lasso</title>
<style>
  :root {
    --bg: #f6f5f2; --ink: #1d1c1a; --muted: #6b675f; --line: #dcd8cf; --accent: #b3471d;
    --pill: #e9e5dc; --ok: #2f7a3d; --warn: #b3471d;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17171a; --ink: #ecebe6; --muted: #a09c93; --line: #2d2d33; --accent: #e5714a;
      --pill: #26262c; --ok: #6fbf7a; --warn: #e5714a; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17171a; --ink: #ecebe6; --muted: #a09c93; --line: #2d2d33; --accent: #e5714a;
    --pill: #26262c; --ok: #6fbf7a; --warn: #e5714a; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 ui-sans-serif, system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0 16px 0 0; letter-spacing: 0.04em; }
  form[data-role="intake"] { display: flex; gap: 8px; flex: 1 1 320px; }
  form[data-role="intake"] input { flex: 1; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; }
  button { padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--pill); color: inherit; cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tick { display: flex; gap: 8px; align-items: center; color: var(--muted); font-variant-numeric: tabular-nums; }
  main { padding: 16px; }
  [data-role="ledger"] { display: grid; gap: 8px; }
  .empty { color: var(--muted); padding: 32px 0; text-align: center; }
  .notice { color: var(--warn); }
  .flagbox { display: grid; gap: 8px; padding: 12px 16px; border: 2px solid var(--warn); border-radius: 8px; margin: 12px 0; max-width: 720px; }
  .flagbox .reason { font-weight: 600; color: var(--warn); }
  .flagbox .last { white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--muted); max-height: 6em; overflow: auto; }
  .gauges { display: flex; flex-wrap: wrap; gap: 16px; margin: 12px 0; }
  .gauge { display: grid; justify-items: center; gap: 2px; cursor: pointer; font-size: 12px; color: var(--muted); }
  .gauge svg { width: 56px; height: 56px; }
  .gauge .track { fill: none; stroke: var(--line); stroke-width: 6; }
  .gauge .arc { fill: none; stroke: var(--ok); stroke-width: 6; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
  .gauge.warn .arc { stroke: #c9962b; }
  .gauge.over .arc { stroke: var(--warn); }
  .gauge .value { color: var(--ink); font-variant-numeric: tabular-nums; }
  .rings { display: flex; gap: 4px; align-self: center; }
  .rings svg { width: 16px; height: 16px; }
  .rings .track { fill: none; stroke: var(--line); stroke-width: 3; }
  .rings .arc { fill: none; stroke: var(--ok); stroke-width: 3; transform: rotate(-90deg); transform-origin: 50% 50%; }
  .rings .warn .arc { stroke: #c9962b; }
  .rings .over .arc { stroke: var(--warn); }
  .editor { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; align-items: end; padding: 12px 16px; border: 1px solid var(--line); border-radius: 8px; margin: 0 0 12px; max-width: 720px; }
  .editor label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  .editor input { padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; font: inherit; }
  .editor .row { display: flex; gap: 8px; grid-column: 1 / -1; }
  .confirm { display: grid; gap: 8px; padding: 12px 16px; border: 1px solid var(--line); border-radius: 8px; margin: 0 0 16px; max-width: 720px; }
  .confirm .row { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  .confirm label, .confirm .why { color: var(--muted); }
  .confirm select { padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; }
  .kind { text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px; color: var(--muted); }
  .ticket { display: grid; grid-template-columns: 110px 1fr auto; gap: 4px 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  .ticket:hover { border-color: var(--accent); }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--pill); white-space: nowrap; align-self: start; }
  .pill.needs_you, .pill.flagged { background: var(--accent); color: #fff; }
  .pill.holding { border: 1px solid var(--accent); color: var(--accent); background: transparent; }
  .triggers { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .triggers button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--pill); cursor: pointer; }
  .triggers button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .triggers button:disabled { opacity: 0.6; cursor: default; }
  .override { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--warn); }
  .override button { font: inherit; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--warn); background: transparent; color: var(--warn); cursor: pointer; }
  .ticket .ref { font-variant-numeric: tabular-nums; }
  .ticket .why, .ticket .repo { color: var(--muted); font-size: 12px; }
  .ticket .stage { color: var(--muted); font-size: 12px; text-align: right; }
  .detail { display: grid; gap: 12px; }
  .detail dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 0; }
  .detail dt { color: var(--muted); }
  .detail dd { margin: 0; font-family: ui-monospace, monospace; font-size: 13px; word-break: break-all; }
  .stations { display: flex; flex-wrap: wrap; gap: 6px; }
  .station { padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; font-size: 12px; color: var(--muted); }
  .station.current { border-color: var(--accent); color: var(--accent); }
  .station.done { color: var(--ok); border-color: var(--ok); }
  a.back { color: var(--muted); }
  .pill.running { background: var(--ok); color: #fff; }
  .session { display: grid; gap: 8px; padding: 12px; border-radius: 8px; background: var(--term-bg); color: var(--term-ink); font-family: ui-monospace, monospace; font-size: 12px; }
  .session .head { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  .session .head strong { color: var(--term-bright); }
  .session .meta { color: var(--term-dim); }
  .session .pill { background: var(--term-pill); color: var(--term-bright); }
  .session .pill.succeeded { background: var(--ok); color: #fff; }
  .session .pill.failed, .session .pill.exhausted, .session .pill.interrupted { background: var(--warn); color: #fff; }
  .session pre { margin: 0; max-height: 360px; overflow: auto; white-space: pre-wrap; word-break: break-all; color: var(--term-dim); }
  .session .final { color: var(--term-bright); border-top: 1px solid var(--term-line); padding-top: 8px; white-space: pre-wrap; }
  .session .final.ok { color: var(--term-ok); }
  .session .paths { display: flex; flex-wrap: wrap; gap: 6px; }
  .session .paths button { font: inherit; font-size: 11px; padding: 2px 8px; background: var(--term-pill); color: var(--term-dim); border-color: var(--term-line); }
  .session button.stop { background: var(--warn); color: #fff; border-color: var(--warn); font: inherit; }
  .session .hint { color: var(--term-dim); }
  .timeline { display: grid; gap: 4px; }
  .timeline h3 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .timeline .row { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-variant-numeric: tabular-nums; font-size: 13px; }
  .timeline .row .meta { color: var(--muted); }
  :root { --term-bg: #1c1d22; --term-ink: #d7d5cd; --term-dim: #8f8c84; --term-bright: #f2f0ea; --term-line: #33353d; --term-pill: #2e3038; --term-ok: #8fd19a; }
</style>
</head>
<body>
<header>
  <h1>LASSO</h1>
  <form data-role="intake" autocomplete="off">
    <input name="input" placeholder="Paste a JIRA key, a GitHub issue, or type a prompt" aria-label="Intake">
    <button class="primary" type="submit">Add</button>
  </form>
  <div class="tick">
    <span data-role="tick-status">tick: never</span>
    <button type="button" data-role="check-now">Check now</button>
  </div>
</header>
<main>
  <p data-role="notice" class="notice" hidden></p>
  <form data-role="confirm" class="confirm" hidden></form>
  <section data-role="ledger" aria-label="Tickets"></section>
  <section data-role="detail" class="detail" hidden></section>
</main>
<script>
(function () {
  const $ = (sel) => document.querySelector(sel);
  const ledger = $('[data-role="ledger"]');
  const detail = $('[data-role="detail"]');
  const confirmPanel = $('[data-role="confirm"]');
  const tickStatus = $('[data-role="tick-status"]');
  const notice = $('[data-role="notice"]');
  const intakeForm = $('form[data-role="intake"]');

  async function api(route, init) {
    const res = await fetch(route, Object.assign({ headers: { 'content-type': 'application/json' } }, init || {}));
    const text = await res.text();
    const body = text ? JSON.parse(text) : null;
    if (!res.ok) { const err = new Error((body && body.error) || (res.status + ' ' + route)); err.status = res.status; err.body = body; throw err; }
    return body;
  }

  function el(tag, attrs, children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === 'class') node.className = v; else if (k === 'text') node.textContent = v; else node.setAttribute(k, v);
    }
    for (const child of children || []) node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
    return node;
  }

  function relative(iso) {
    if (!iso) return 'never';
    const s = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
    if (s < 60) return s + 's ago';
    const m = Math.round(s / 60);
    return m < 60 ? m + 'm ago' : Math.round(m / 60) + 'h ago';
  }

  function showNotice(msg) { notice.textContent = msg || ''; notice.hidden = !msg; }

  async function refreshTick() {
    try {
      const t = await api('/api/tick');
      const next = t.nextTick ? Math.max(0, Math.round((new Date(t.nextTick).getTime() - Date.now()) / 1000)) + 's' : 'manual';
      tickStatus.textContent = 'last tick ' + relative(t.lastTick) + ' / next in ' + next;
    } catch (e) { tickStatus.textContent = 'tick: unreachable'; }
  }

  function ticketRow(t) {
    const row = el('article', { class: 'ticket', 'data-id': t.id }, [
      el('span', { class: 'pill ' + t.display.state, text: t.display.label || t.display.state }),
      el('div', {}, [el('div', { class: 'ref', text: t.reference || t.shortId }), el('div', { class: 'repo', text: t.repo })]),
      el('div', { class: 'stage', text: t.stage.label + ' · ' + (t.stage.index + 1) + '/' + t.stage.total }),
      miniRings(t.budget),
      el('div', {}, [el('div', { text: t.title }), el('div', { class: 'why', text: t.display.why })]),
      el('div', { class: 'stage', text: relative(t.updatedAt) }),
    ]);
    row.addEventListener('click', () => { location.hash = t.id; });
    return row;
  }

  async function refreshLedger() {
    const tickets = await api('/api/tickets');
    ledger.replaceChildren();
    if (!tickets.length) {
      ledger.appendChild(el('p', { class: 'empty', text: 'No active Tickets. Paste a reference or a prompt above to start one.' }));
      return;
    }
    for (const t of tickets) ledger.appendChild(ticketRow(t));
  }

  function duration(ms) {
    const s = Math.round(ms / 1000);
    if (s < 60) return s + 's';
    const m = Math.floor(s / 60);
    return m < 60 ? m + 'm' + (s % 60) + 's' : Math.floor(m / 60) + 'h' + (m % 60) + 'm';
  }

  function svg(tag, attrs) {
    const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
    return node;
  }

  // One ring: the arc is the share used, amber from 70 %, red at the limit.
  function ring(g, size) {
    const r = size / 2 - 4, c = 2 * Math.PI * r;
    const share = g.limit > 0 ? Math.min(1, g.used / g.limit) : 1;
    const node = svg('svg', { viewBox: '0 0 ' + size + ' ' + size, class: share >= 1 ? 'over' : share >= 0.7 ? 'warn' : '' });
    node.appendChild(svg('circle', { class: 'track', cx: size / 2, cy: size / 2, r }));
    node.appendChild(svg('circle', { class: 'arc', cx: size / 2, cy: size / 2, r, 'stroke-dasharray': c, 'stroke-dashoffset': c * (1 - share) }));
    return node;
  }

  const GAUGES = [
    ['rounds', 'Rounds', (g) => g.used + '/' + g.limit],
    ['attempts', 'attempts', (g) => g.used + '/' + g.limit],
    ['wallTime', 'wall time', (g) => duration(g.used) + '/' + g.limitText],
    ['spend', 'spend', (g) => '$' + g.used.toFixed(2) + '/$' + g.limit],
  ];

  // The Ledger's four mini rings, no words.
  function miniRings(b) {
    return el('span', { class: 'rings', 'data-role': 'rings', title: GAUGES.map(([k, name, text]) => name + ' ' + text(b[k])).join(' · ') }, GAUGES.map(([k]) => ring(b[k], 16)));
  }

  // The four ring gauges; any of them opens the inline Ticket-layer editor (Extend). A starred value is set on the Ticket.
  function gauges(t, openEditor) {
    return el('div', { class: 'gauges', 'data-role': 'gauges' }, GAUGES.map(([k, name, text]) => {
      const g = t.budget[k];
      const share = g.limit > 0 ? g.used / g.limit : 1;
      const node = el('div', { class: 'gauge' + (share >= 1 ? ' over' : share >= 0.7 ? ' warn' : ''), 'data-gauge': k, title: 'set ' + (g.source === 'ticket' ? 'on this Ticket' : g.source === 'pipeline' ? 'by the Pipeline' : 'globally') + '; click to extend' },
        [ring(g, 56), el('span', { class: 'value', text: text(g) + (g.source === 'ticket' ? '*' : '') }), el('span', { text: name })]);
      node.addEventListener('click', openEditor);
      return node;
    }));
  }

  function budgetEditor(t) {
    const form = el('form', { class: 'editor', 'data-role': 'budget-editor' });
    form.hidden = true;
    const fields = GAUGES.map(([k, name]) => {
      const g = t.budget[k];
      const input = el('input', { name: k, placeholder: k === 'wallTime' ? g.limitText : String(g.limit), value: t.budget.ticket[k] === null ? '' : String(t.budget.ticket[k]) });
      return [k, input, el('label', {}, [name + (k === 'spend' ? ' (USD)' : k === 'wallTime' ? ' (30m, 1h)' : ''), input])];
    });
    const save = el('button', { class: 'primary', type: 'submit', text: 'Save' });
    const cancel = el('button', { type: 'button', text: 'Cancel' });
    cancel.addEventListener('click', () => { form.hidden = true; });
    form.replaceChildren(...fields.map((f) => f[2]), el('div', { class: 'row' }, [save, cancel, el('span', { class: 'why', text: 'blank falls back to the Pipeline or global value; a running Session keeps the wall time it started with' })]));
    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const body = {};
      for (const [k, input] of fields) {
        const raw = input.value.trim();
        if (raw !== '' && k !== 'wallTime' && !/^\d+(\.\d+)?$/.test(raw)) { showNotice(k + ' must be a number'); input.focus(); return; }
        body[k] = raw === '' ? null : k === 'wallTime' ? raw : Number(raw);
      }
      save.disabled = true;
      try { await api('/api/tickets/' + encodeURIComponent(t.id) + '/extend', { method: 'POST', body: JSON.stringify(body) }); showDetail(t.id); }
      catch (e) { showNotice(e.message); save.disabled = false; }
    });
    return form;
  }

  // The Flag box: why, when, the last word from the Runner, and the six exits in the trigger bar below it.
  function flagBox(t) {
    const last = t.session && t.session.finalMessage;
    return el('div', { class: 'flagbox', 'data-role': 'flagbox' }, [
      el('div', {}, [el('span', { class: 'reason', text: t.flag.reason }), ' ', el('span', { class: 'meta', text: 'Flagged ' + relative(t.flag.at) })]),
      el('div', { text: t.flag.detail || '' }),
      last ? el('div', { class: 'last', text: last }) : el('span'),
    ]);
  }

  function copyChip(label, value) {
    const chip = el('button', { type: 'button', text: label, title: value });
    chip.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(value); chip.textContent = 'copied'; }
      catch (e) { chip.textContent = value; }
      setTimeout(() => { chip.textContent = label; }, 1500);
    });
    return chip;
  }

  // Each showDetail is a generation; a pane whose generation has passed stops polling and never re-renders.
  let detailGen = 0;

  function sessionPane(t, s, gen) {
    const pane = el('section', { class: 'session', 'data-role': 'session' });
    const outcome = s.running ? 'running' : (s.outcome || 'unknown');
    const head = el('div', { class: 'head' }, [
      el('span', { class: 'pill ' + outcome, text: outcome + (s.endedReason ? ' · ' + s.endedReason : '') }),
      el('strong', { text: s.stage + ' #' + s.ordinal }),
      el('span', { class: 'meta', text: s.mode + ' · ' + s.startedBy }),
      el('span', { class: 'meta', 'data-role': 'duration', text: duration(s.durationMs) }),
      el('span', { class: 'meta', text: s.costUsd === null ? '' : '$' + s.costUsd.toFixed(2) }),
      el('span', { class: 'meta', text: 'started ' + relative(s.startedAt) }),
    ]);
    if (s.running && s.mode === 'headless') {
      const stop = el('button', { class: 'stop', type: 'button', text: 'Stop' });
      stop.addEventListener('click', async () => {
        stop.disabled = true;
        try { await api('/api/tickets/' + encodeURIComponent(t.id) + '/sessions/' + s.id + '/stop', { method: 'POST' }); showDetail(t.id); }
        catch (e) { showNotice(e.message); stop.disabled = false; }
      });
      head.appendChild(stop);
    }
    if (s.mode === 'terminal') {
      const opened = s.openedAt ? 'terminal opened ' + relative(s.openedAt) : 'not opened yet';
      if (s.running && t.triggers.some((x) => x.action === 'terminal')) {
        const reopen = el('button', { class: 'stop', type: 'button', text: 'Open terminal' });
        reopen.addEventListener('click', async () => {
          reopen.disabled = true;
          try { await api('/api/tickets/' + encodeURIComponent(t.id) + '/terminal', { method: 'POST', body: '{}' }); showDetail(t.id); }
          catch (e) { showNotice(e.message); reopen.disabled = false; }
        });
        head.appendChild(reopen);
      }
      pane.replaceChildren(head, el('div', { class: 'hint', text: opened + '. Lasso tracks this Session by its id only: the row ends when you mark the Stage done or skip it.' }),
        el('div', { class: 'paths' }, [copyChip('worktree', t.worktree), copyChip('session id', s.id), s.runnerSessionId ? copyChip('runner session', s.runnerSessionId) : el('span'), s.transcriptPath ? copyChip('transcript', s.transcriptPath) : el('span')]));
      return pane;
    }
    const final = el('div', { class: 'final' + (s.outcome === 'succeeded' ? ' ok' : ''), text: s.finalMessage || '' });
    final.hidden = !s.finalMessage;
    if (s.mode === 'action') {
      pane.replaceChildren(head, el('div', { class: 'hint', text: 'Lasso performed this Stage itself; there is no Runner output.' }), final);
      return pane;
    }
    const out = el('pre', { text: '' });
    const paths = el('div', { class: 'paths' }, [
      copyChip('worktree', t.worktree),
      s.stdoutPath ? copyChip('stdout', s.stdoutPath) : el('span'),
      s.runnerSessionId ? copyChip('runner session', s.runnerSessionId) : el('span'),
      s.transcriptPath ? copyChip('transcript', s.transcriptPath) : el('span'),
    ]);
    pane.replaceChildren(head, out, final, paths);

    let offset = 0;
    let stale = false;
    async function tail() {
      const current = () => gen === detailGen && !stale;
      try {
        const chunk = await api('/api/tickets/' + encodeURIComponent(t.id) + '/sessions/' + s.id + '/stdout?offset=' + offset);
        if (!current()) return;
        if (chunk.text) { out.textContent += chunk.text; out.scrollTop = out.scrollHeight; }
        offset = chunk.offset;
        if (chunk.ended) { if (s.running) showDetail(t.id); return; }
      } catch (e) {
        if (!current()) return;
        if (!stale) { stale = true; out.textContent += '\n[stdout unavailable: ' + e.message + '; retrying]'; stale = false; }
      }
      if (!s.running || !current()) return;
      head.querySelector('[data-role="duration"]').textContent = duration(Date.now() - new Date(s.startedAt).getTime());
      setTimeout(tail, 1000);
    }
    tail();
    return pane;
  }

  function timeline(sessions) {
    return el('div', { class: 'timeline', 'data-role': 'timeline' }, [
      el('h3', { text: 'Sessions' }),
      ...sessions.map((s) => el('div', { class: 'row' }, [
        el('span', { class: 'pill ' + (s.running ? 'running' : s.outcome || ''), text: s.running ? 'running' : (s.outcome || '?') }),
        el('span', { text: s.stage + ' #' + s.ordinal }),
        el('span', { class: 'meta', text: s.mode + ' · ' + s.startedBy + (s.endedReason ? ' · ' + s.endedReason : '') }),
        el('span', { class: 'meta', text: duration(s.durationMs) + (s.costUsd === null ? '' : ' · $' + s.costUsd.toFixed(2)) }),
        el('span', { class: 'meta', text: relative(s.startedAt) }),
      ])),
    ]);
  }

  // The levers on this Ticket. Mark done met with a missing artifact offers to advance anyway, inline;
  // Extend opens the Budget editor; Abandon asks for a second click.
  function triggerBar(t, openEditor) {
    const bar = el('div', { class: 'triggers', 'data-role': 'triggers' });
    const buttons = t.triggers.map((trigger) => {
      const primary = trigger.action === 'terminal' || trigger.action === 'start' || trigger.action === 'retry';
      const button = el('button', { type: 'button', text: trigger.label, class: primary ? 'primary' : '', 'data-action': trigger.action });
      if (trigger.action === 'extend') button.addEventListener('click', openEditor);
      else if (trigger.action === 'abandon') button.addEventListener('click', () => {
        if (button.dataset.armed) { pull('abandon', {}); return; }
        button.dataset.armed = '1'; button.textContent = 'Abandon for sure?';
        setTimeout(() => { delete button.dataset.armed; button.textContent = trigger.label; }, 4000);
      });
      else button.addEventListener('click', () => pull(trigger.action, {}));
      return button;
    });
    bar.replaceChildren(...buttons);
    async function pull(action, body) {
      for (const b of buttons) b.disabled = true;
      try {
        await api('/api/tickets/' + encodeURIComponent(t.id) + '/' + action, { method: 'POST', body: JSON.stringify(body) });
        showDetail(t.id);
      } catch (e) {
        for (const b of buttons) b.disabled = false;
        if (e.status === 409 && e.body && e.body.override) {
          const anyway = el('button', { type: 'button', text: 'Advance anyway' });
          anyway.addEventListener('click', () => { anyway.disabled = true; pull(action, { override: true }); });
          bar.replaceChildren(...buttons, el('div', { class: 'override', 'data-role': 'override' }, [
            el('span', { text: 'artifact ' + e.body.artifact + ' is missing: ' + e.body.detail }), anyway]));
        } else showNotice(e.message);
      }
    }
    return bar;
  }

  async function showDetail(id) {
    const gen = ++detailGen;
    let t;
    try { t = await api('/api/tickets/' + encodeURIComponent(id)); }
    catch (e) { showNotice(e.message); location.hash = ''; return; }
    if (gen !== detailGen) return;
    const back = el('a', { class: 'back', href: '#', text: '← all Tickets' });
    const stations = el('div', { class: 'stations' }, t.stages.map((s, i) =>
      el('span', { class: 'station' + (i < t.stage.index ? ' done' : i === t.stage.index ? ' current' : ''), text: s.label })));
    const children = [
      back,
      el('h2', { text: (t.reference ? t.reference + ' · ' : '') + t.title }),
      el('div', {}, [el('span', { class: 'pill ' + t.display.state, text: t.display.label }), ' ', el('span', { class: 'why', text: t.display.why + (t.mirrorPending ? ' · tracker labels not written yet' : '') })]),
      stations,
    ];
    const editor = budgetEditor(t);
    const openEditor = () => { editor.hidden = false; editor.querySelector('input').focus(); };
    // A Flagged Ticket's exits live in its Flag box (spec: the Flag box); otherwise the triggers stand alone.
    const bar = t.triggers.length ? triggerBar(t, openEditor) : null;
    if (t.flag) { const box = flagBox(t); if (bar) box.append(bar); children.push(box); }
    else if (bar) children.push(bar);
    children.push(gauges(t, openEditor), editor);
    if (t.session) children.push(sessionPane(t, t.session, gen));
    children.push(el('dl', {}, [
      el('dt', { text: 'repo' }), el('dd', { text: t.repo }),
      el('dt', { text: 'branch' }), el('dd', { text: t.branch }),
      el('dt', { text: 'worktree' }), el('dd', { text: t.worktree }),
      el('dt', { text: 'pipeline' }), el('dd', { text: t.pipeline }),
      el('dt', { text: 'id' }), el('dd', { text: t.id }),
    ]));
    if (t.sessions.length) children.push(timeline(t.sessions));
    detail.replaceChildren(...children);
    ledger.hidden = true; detail.hidden = false;
  }

  function route() {
    const id = location.hash.replace(/^#/, '');
    if (id) showDetail(id); else { detailGen++; detail.hidden = true; ledger.hidden = false; refreshLedger(); }
  }

  function select(name, choices, suggestion) {
    const s = el('select', { name });
    if (!suggestion) s.appendChild(el('option', { value: '', text: 'pick one' }));
    for (const c of choices) { const o = el('option', { value: c, text: c }); if (c === suggestion) o.selected = true; s.appendChild(o); }
    return s;
  }

  intakeForm.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const input = intakeForm.elements.input.value.trim();
    if (!input) return;
    showNotice('');
    try {
      const d = await api('/api/intake/detect', { method: 'POST', body: JSON.stringify({ input }) });
      const repoSelect = select('repo', d.repo.choices, d.repo.suggestion);
      const pipelineSelect = select('pipeline', d.pipeline.choices, d.pipeline.suggestion);
      const notes = el('div', { class: 'notes' });
      const showNotes = (list) => notes.replaceChildren(...list.map((n) => el('div', { class: 'why', text: n })));
      showNotes(d.notes);
      repoSelect.addEventListener('change', async () => {
        // The Pipeline default follows the repo: re-pick it whenever the repo changes.
        const p = d.pipeline.byRepo[repoSelect.value];
        if (p) pipelineSelect.value = p;
        // A reference's branch depends on the repo: re-detect for the chosen repo to refresh the notes.
        if (!d.reference) return;
        showNotes([]);
        try {
          const again = await api('/api/intake/detect', { method: 'POST', body: JSON.stringify({ input, repo: repoSelect.value }) });
          showNotes(again.notes);
        } catch (e) { showNotice(e.message); }
      });
      confirmPanel.replaceChildren(
        el('div', { class: 'kind', text: d.kind + (d.reference ? ' ' + d.reference : '') }),
        el('div', { text: d.title || input }),
        el('div', { class: 'row' }, [el('label', { text: 'repo' }), repoSelect, el('label', { text: 'pipeline' }), pipelineSelect]),
        notes,
        el('div', { class: 'row' }, [el('button', { class: 'primary', type: 'submit', text: 'Confirm' }), el('button', { type: 'button', 'data-role': 'cancel', text: 'Cancel' })]),
      );
      confirmPanel.dataset.input = input;
      confirmPanel.hidden = false;
      confirmPanel.querySelector('[data-role="cancel"]').addEventListener('click', () => { confirmPanel.hidden = true; });
    } catch (e) { showNotice(e.message); }
  });

  confirmPanel.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const repo = confirmPanel.elements.repo.value;
    if (!repo) { showNotice('repo is ambiguous: pick one'); return; }
    try {
      const t = await api('/api/tickets', { method: 'POST', body: JSON.stringify({ input: confirmPanel.dataset.input, repo, pipeline: confirmPanel.elements.pipeline.value }) });
      confirmPanel.hidden = true;
      intakeForm.reset();
      if (t.branchExisted) showNotice('checked out existing branch ' + t.branch);
      location.hash = '';
      await refreshLedger();
    } catch (e) { showNotice(e.message); }
  });

  $('[data-role="check-now"]').addEventListener('click', async () => {
    try { await api('/api/check-now', { method: 'POST' }); await refreshTick(); route(); }
    catch (e) { showNotice(e.message); }
  });

  window.addEventListener('hashchange', route);
  refreshTick(); route();
  setInterval(refreshTick, 5000);
  setInterval(() => { if (!ledger.hidden) refreshLedger(); }, 10000);
})();
</script>
</body>
</html>
