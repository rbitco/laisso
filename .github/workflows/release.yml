name: Release

# Pushing a vX.Y.Z tag publishes @rbitco/lasso to the homelab Verdaccio
# (ADR 0013). The version lives only in the tag: package.json stays
# 0.0.0-dev in git, since main only takes squash-merged PRs, and is set
# from the tag here before packing.
#
# Self-hosted: npm.matty.rocks is LAN-only, so a GitHub-hosted runner
# cannot reach it.
#
# Run by hand (workflow_dispatch) it is a dry run: everything up to the
# smoke test, as 0.0.0-dryrun, with nothing published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, rbitco]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The rbitco org allows only GitHub-owned and verified actions, so
      # pnpm comes from npm rather than pnpm/action-setup.
      - run: npm install --global pnpm@8

      - run: pnpm install --frozen-lockfile

      # Some tests commit in temporary repos.
      - run: |
          git config --global user.name "lasso release"
          git config --global user.email "release@lasso.invalid"

      # The suite drives real processes against timing; on this shared
      # 4-core runner fewer workers and a retry keep load-induced flakes
      # from blocking a release. A test that fails three times still fails.
      - run: pnpm test -- --maxWorkers=2 --retry=2

      - name: Set version from tag
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION=0.0.0-dryrun; fi
          npm version "$VERSION" --no-git-tag-version
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # prepack typechecks, builds the dashboard, then bundles.
      - run: npm pack

      # Stops the release before anything is published if the tarball
      # does not install and serve as $VERSION.
      - run: node scripts/smoke-test.ts "rbitco-lasso-$VERSION.tgz" "$VERSION"

      - name: Publish to npm.matty.rocks
        if: github.ref_type == 'tag'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npmrc="$RUNNER_TEMP/.npmrc"
          echo "//npm.matty.rocks/:_authToken=${NPM_TOKEN}" > "$npmrc"
          npm publish "rbitco-lasso-$VERSION.tgz" --userconfig "$npmrc"
          rm -f "$npmrc"

      - name: GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "rbitco-lasso-$VERSION.tgz" --generate-notes
